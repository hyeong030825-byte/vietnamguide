# Builds the Android app from app/www.
#  - android-test-apk: install it on an Android phone to try the app (no store needed)
#  - android-play-bundle: the .aab for Google Play, signed when the ANDROID_* secrets are set (see app/README.md)
name: App (Android)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Make the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/prepare-android.sh
      - name: Upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret yet, so the Play bundle is unsigned. The test APK works anyway."
          fi
      - name: Build
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: android-play-bundle
          path: app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
