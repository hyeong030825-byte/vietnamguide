var RATE_MIN = 25, RATE_MAX = 100; /* sane band for KRW per 1,000 VND */
var round2 = function (n) { return Math.round(n * 100) / 100; };
function effRate() { var c = state.calc; return c.manual || (c.live && c.live.rate) || DEFAULT_RATE; }

function fmtAsOf(s) {
  if (!s) return '';
  var dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(s);
  var d = new Date(dateOnly ? s + 'T00:00:00Z' : s);
  if (isNaN(d.getTime())) return '';
  var opt = dateOnly ? { month: 'long', day: 'numeric', timeZone: 'UTC' } : { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
  try { return d.toLocaleString(state.lang === 'en' ? 'en-US' : 'ko-KR', opt); } catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
}
function rateStatusHtml() {

  if (c.manual) {

    extra = '<button type="button" data-action="rate-live" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-secondary-500/15 hover:bg-secondary-500/25 border border-secondary-500/30 text-[11px] font-bold text-secondary-300 cursor-pointer transition-colors"><i class="ri-refresh-line"></i>' + esc(t('rateUseLive')) + '</button>';
  } else if (c.live) {

  } else if (c.status === 'loading') {

  } else {

  }

}

  var inp = document.getElementById('rate-input'); if (inp && document.activeElement !== inp) inp.value = round2(effRate());

function setLive(live, status) {
  state.calc.live = live; state.calc.status = live ? 'live' : (status || 'fallback');
  updateRateUI();
}
function fetchLiveRate() {
  if (typeof fetch !== 'function') { if (!state.calc.live) setLive(null, 'fallback'); return; }
  var getJson = function (url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); };
  getJson('https://open.er-api.com/v6/latest/KRW').then(function (j) {
    var v = j && j.result === 'success' && j.rates ? Number(j.rates.VND) : 0;
    if (!v) throw new Error('bad payload');
    return { vnd: v, asOf: j.time_last_update_unix ? new Date(j.time_last_update_unix * 1000).toISOString() : '', source: 'ExchangeRate-API' };
  }).catch(function () {
    return getJson('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json').then(function (j) {
      var v = j && j.krw ? Number(j.krw.vnd) : 0;
      if (!v) throw new Error('bad payload');
      return { vnd: v, asOf: j.date || '', source: 'Currency API' };
    });
  }).then(function (o) {
    var rate = 1000 / o.vnd;
    if (!(rate > RATE_MIN && rate < RATE_MAX)) throw new Error('out of range');
    setLive({ rate: rate, asOf: o.asOf, source: o.source, at: Date.now() });
  }).catch(function () { if (!state.calc.live) setLive(null, 'fallback'); });
}
function startLiveRate() {
  var cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    /* Inside a Claude page: read the rate kept in this page's database, refreshed on a schedule. */
    var fail = function () { if (!state.calc.live) setLive(null, 'fallback'); };
    Promise.resolve().then(function () { return cl.use('db'); }).then(function (db) {
      if (!db) { fail(); return; }
      try {
        db.doc('rates/krw_vnd').onSnapshot(function (snap) {
          var d = snap && snap.exists ? snap.data() : null;
          var r = d ? Number(d.krwPer1000Vnd) : 0;
          if (r > RATE_MIN && r < RATE_MAX) setLive({ rate: r, asOf: d.asOf || d.updatedAt || '', source: d.source || '' });
          else fail();
        }, fail);
      } catch (e) { fail(); }
    }, fail);
  } else {
    /* Hosted anywhere else (e.g. Netlify): fetch the live rate directly and refresh while the page stays open. */
    fetchLiveRate();
    setInterval(function () { if (!document.hidden) fetchLiveRate(); }, 30 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      var l = state.calc.live;
      if (!document.hidden && (!l || !l.at || Date.now() - l.at > 30 * 60 * 1000)) fetchLiveRate();
    });
  }
}

function calcNumbers() {
  var c = state.calc, rate = effRate(), r = rate / 1000, a = c.amount, out = {};

    out.quick = '≈ ' + fmt(quick) + t('unitK');

    out.diff = exact > 0 ? (exact - quick) / exact * 100 : (r * 1000 - 50) / (r * 1000) * 100;
    out.under = out.diff > 0;
  } else {
    var quick2 = a * 20, exact2 = r > 0 ? a / r : 0;

    out.diff = exact2 > 0 ? (quick2 - exact2) / exact2 * 100 : (20000 - base) / base * 100;

function searchView(q) {
  var accented = /[\u0300-\u036f]/.test(q.normalize('NFD')) || /đ/i.test(q);

  var ws = [];

  var us = MONEY_UNITS.filter(function (m) { return hit([m.u, m.say, m.pr, m.k]); });

      return '<button type="button" data-action="goto-tab" data-value="' + k + '" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-accent-500/10 hover:bg-accent-500/20 border border-accent-500/30 text-accent-400 text-sm font-bold cursor-pointer transition-colors"><i class="' + tabIcon[k] + ' text-base"></i>' + esc(t('tab_' + k)) + ' <span class="text-xs font-semibold text-foreground-500">' + esc(t('goTab')) + '</span><i class="ri-arrow-right-line"></i></button>';
