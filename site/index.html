var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var fmt = function (n) { return Math.round(n || 0).toLocaleString('en-US'); };

var cap = function (s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; };

function svgFor(name) {
  var d = ICONS[name]; if (!d) return '';
  return '<svg class="ico' + (d.fa ? ' fa' : '') + '" viewBox="' + d.v + '" aria-hidden="true" focusable="false">' + d.p + '</svg>';
}
function hydrate(root) {
  if (!root) return;
  $$('i', root).forEach(function (el) {
    if (el.firstElementChild) return;
    var name = null;
    for (var i = 0; i < el.classList.length; i++) {
      var c = el.classList[i];
      if ((c.indexOf('ri-') === 0 || c.indexOf('fa-') === 0) && ICONS[c]) { name = c; break; }
    }
    if (name) { el.innerHTML = svgFor(name); el.setAttribute('aria-hidden', 'true'); }
  });
}

var RATE_MIN = 25, RATE_MAX = 100; /* sane band for KRW per 1,000 VND */
var round2 = function (n) { return Math.round(n * 100) / 100; };
function effRate() { var c = state.calc; return c.manual || (c.live && c.live.rate) || DEFAULT_RATE; }

function fmtAsOf(s) {
  if (!s) return '';

  var d = new Date(dateOnly ? s + 'T00:00:00Z' : s);
  if (isNaN(d.getTime())) return '';
  var opt = dateOnly ? { month: 'long', day: 'numeric', timeZone: 'UTC' } : { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
  try { return d.toLocaleString(state.lang === 'en' ? 'en-US' : 'ko-KR', opt); } catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
}
function rateStatusHtml() {

  } else if (c.live) {
    dot = 'bg-secondary-400 animate-pulse'; text = tf('rateLive', { time: fmtAsOf(c.live.asOf) || '—', src: c.live.source || '' });
  } else if (c.status === 'loading') {
    dot = 'bg-foreground-400 animate-pulse'; text = t('rateLoading');
  } else {
    dot = 'bg-primary-400'; text = t('rateFallback');
  }
  return '<span class="w-2 h-2 rounded-full flex-shrink-0 mt-1.5 ' + dot + '" aria-hidden="true"></span><span class="flex-1 min-w-0">' + esc(text) + '</span>' + extra;
}
function updateRateUI() {

  var inp = document.getElementById('rate-input'); if (inp && document.activeElement !== inp) inp.value = round2(effRate());
  updateCalc();
}
function setLive(live, status) {
  state.calc.live = live; state.calc.status = live ? 'live' : (status || 'fallback');
  updateRateUI();
}
function fetchLiveRate() {
  if (typeof fetch !== 'function') { if (!state.calc.live) setLive(null, 'fallback'); return; }
  var getJson = function (url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); };
  getJson('https://open.er-api.com/v6/latest/KRW').then(function (j) {
    var v = j && j.result === 'success' && j.rates ? Number(j.rates.VND) : 0;
    if (!v) throw new Error('bad payload');
    return { vnd: v, asOf: j.time_last_update_unix ? new Date(j.time_last_update_unix * 1000).toISOString() : '', source: 'ExchangeRate-API' };
  }).catch(function () {
    return getJson('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json').then(function (j) {
      var v = j && j.krw ? Number(j.krw.vnd) : 0;
      if (!v) throw new Error('bad payload');
      return { vnd: v, asOf: j.date || '', source: 'Currency API' };
    });
  }).then(function (o) {
    var rate = 1000 / o.vnd;
    if (!(rate > RATE_MIN && rate < RATE_MAX)) throw new Error('out of range');
    setLive({ rate: rate, asOf: o.asOf, source: o.source, at: Date.now() });
  }).catch(function () { if (!state.calc.live) setLive(null, 'fallback'); });
}
function startLiveRate() {
  var cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    /* Inside a Claude page: read the rate kept in this page's database, refreshed on a schedule. */
    var fail = function () { if (!state.calc.live) setLive(null, 'fallback'); };
    Promise.resolve().then(function () { return cl.use('db'); }).then(function (db) {
      if (!db) { fail(); return; }
      try {
        db.doc('rates/krw_vnd').onSnapshot(function (snap) {
          var d = snap && snap.exists ? snap.data() : null;
          var r = d ? Number(d.krwPer1000Vnd) : 0;
          if (r > RATE_MIN && r < RATE_MAX) setLive({ rate: r, asOf: d.asOf || d.updatedAt || '', source: d.source || '' });
          else fail();
        }, fail);
      } catch (e) { fail(); }
    }, fail);
  } else {
    /* Hosted anywhere else (e.g. Netlify): fetch the live rate directly and refresh while the page stays open. */
    fetchLiveRate();
    setInterval(function () { if (!document.hidden) fetchLiveRate(); }, 30 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      var l = state.calc.live;
      if (!document.hidden && (!l || !l.at || Date.now() - l.at > 30 * 60 * 1000)) fetchLiveRate();
    });
  }
}

function calcNumbers() {
  var c = state.calc, rate = effRate(), r = rate / 1000, a = c.amount, out = {};

    out.quick = '≈ ' + fmt(quick) + t('unitK');
    out.exact = fmt(exact) + t('unitK');
    out.diff = exact > 0 ? (exact - quick) / exact * 100 : (r * 1000 - 50) / (r * 1000) * 100;
    out.under = out.diff > 0;
  } else {
    var quick2 = a * 20, exact2 = r > 0 ? a / r : 0;
    out.steps = fmt(a) + ' → ×2 → ' + fmt(a * 2) + ' → +0';

    out.exact = fmt(exact2) + t('unitV');

    out.diff = exact2 > 0 ? (quick2 - exact2) / exact2 * 100 : (20000 - base) / base * 100;

  var p = Math.abs(out.diff);

function searchView(q) {
  var nq = norm(q);
  var hit = function (fields) { return norm(fields.join(' ')).indexOf(nq) >= 0; };
  var ph = PHRASES.filter(function (p) { return hit([p.ko[0], p.ko[1], p.en, p.vi[0], p.vi[1], p.pr[0], p.pr[1], p.k, p.note ? p.note.ko + ' ' + p.note.en : '']); });
  var ds = DISHES.filter(function (d) { return hit([d.vi, d.ko, d.en, d.pr, d.k, d.d.ko, d.d.en]); });
  var ws = [];
  WORDS.forEach(function (g) { g.items.forEach(function (w) { if (hit([w.vi, w.ko, w.en, w.pr])) ws.push(w); }); });
  var tabs = Object.keys(TAB_KEYS).filter(function (k) {
    var words = norm(TAB_KEYS[k]).split(' ');
    return words.some(function (w) { return w && (w.indexOf(nq) >= 0 || (nq.length >= 2 && nq.indexOf(w) >= 0)); });
  });
  var total = ph.length + ds.length + ws.length;
  var box = function (emoji, title, n, inner) {
    return '<div class="bg-background-100 p-5 rounded-2xl border border-background-200 space-y-3"><h3 class="font-heading font-bold text-foreground-950 text-base flex items-center gap-2"><span aria-hidden="true">' + emoji + '</span>' + esc(title) + ' <span class="text-xs text-foreground-400 tabular">' + n + '</span></h3>' + inner + '</div>';

  var html = '<section class="space-y-6"><div class="flex flex-wrap items-center justify-between gap-3"><p class="text-sm text-foreground-500">' + esc(tf('results', { q: q, n: total })) + '</p>' +

  if (tabs.length) {
    html += '<div class="flex flex-wrap gap-2">' + tabs.map(function (k) {
      return '<button type="button" data-action="goto-tab" data-value="' + k + '" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-accent-500/10 hover:bg-accent-500/20 border border-accent-500/30 text-accent-400 text-sm font-bold cursor-pointer transition-colors"><i class="' + tabIcon[k] + ' text-base"></i>' + esc(t('tab_' + k)) + ' <span class="text-xs font-semibold text-foreground-500">' + esc(t('goTab')) + '</span><i class="ri-arrow-right-line"></i></button>';
    }).join('') + '</div>';
  }
  if (ph.length) html += box('💬', t('secPhrases'), ph.length, '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + ph.map(phraseCard).join('') + '</div>');
  if (ds.length) html += box('🍜', t('secDishes'), ds.length, '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">' + ds.map(dishCard).join('') + '</div>');
  if (ws.length) html += box('📖', t('secWords'), ws.length, '<div class="flex flex-wrap gap-2">' + ws.map(wordChip).join('') + '</div>');
  if (!total && !tabs.length) {

  return html + '</section>';
}

    case 'copy': copyText(el.getAttribute('data-text')); break;
    case 'bookmark': toggleBm(el.getAttribute('data-id')); break;
    case 'phrase-cat': state.phraseCat = v; renderMain(); break;
    case 'slow': state.slow = !state.slow; store.set('slow', state.slow); renderMain(); break;
    case 'calc-dir':
      if (state.calc.dir !== v) { state.calc.dir = v; state.calc.amount = v === 'v2k' ? 150000 : 10000; renderMain(); } break;
    case 'calc-add': state.calc.amount = Math.min(state.calc.amount + Number(v), 999999999999); renderMain(); break;
    case 'calc-clear': state.calc.amount = 0; renderMain(); var ci = $('#calc-input'); if (ci) ci.focus(); break;
    case 'rate-live': state.calc.manual = null; store.set('rateManual', null); updateRateUI(); break;
    case 'region': state.food.region = v; store.set('region', v); renderMain(); break;
    case 'sw': state.food.sw[v] = !state.food.sw[v]; store.set('sw', state.food.sw); renderMain(); break;
    case 'food-cat': state.food.cat = v; renderMain(); break;
    case 'big-order': var o = orderSentence(); if (o) openModal('big', { label: t('showStaff'), vi: o.vi, meaning: o.meaning }); break;
    case 'big': openModal('big', { label: t('emPhrasesDesc'), vi: el.getAttribute('data-vi'), meaning: el.getAttribute('data-meaning') }); break;
    case 'show-address':
      if (!state.notes.addr.trim()) { toast(t('needAddr'), 'ri-information-line'); var na = $('#note-addr'); if (na) na.focus(); break; }
      openModal('big', { label: t('showDriver'), title: 'Làm ơn chở tôi đến địa chỉ này:', vi: state.notes.addr, sub: state.notes.name, meaning: t('driverMeaning'), speak: 'Làm ơn chở tôi đến địa chỉ này. ' + state.notes.addr }); break;
    case 'clear-search': state.query = ''; $('#search').value = ''; updateSearchClear(); applyStatic(); renderMain(); $('#search').focus(); break;
    case 'suggest': state.query = v; $('#search').value = v; updateSearchClear(); renderMain(); break;
    case 'card-flip': deckFlip(); break;
    case 'card-prev': deckMove(-1); break;
    case 'card-next': deckMove(1); break;
    case 'card-mark': deckMark(v); break;
    case 'card-shuffle':
      var ids = deckItems().map(function (x) { return x.id; });
      for (var j = ids.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var tmp = ids[j]; ids[j] = ids[k]; ids[k] = tmp; }
      state.deck.order = ids; state.deck.cur = ids[0] || null; state.deck.flipped = false; renderModal(); break;
    case 'deck-src': state.deck.source = v; state.deck.order = null; state.deck.cur = null; state.deck.flipped = false; state.deck.resetArmed = false; renderModal(); break;
    case 'deck-hide': state.deck.hideKnown = !state.deck.hideKnown; store.set('deckHideKnown', state.deck.hideKnown); state.deck.resetArmed = false; renderModal(); break;
    case 'deck-reset': deckReset(); break;
  }
});

var noteTimer = null;
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'search') {
    state.query = e.target.value.trim(); updateSearchClear(); applyStatic(); renderMain();
  } else if (id === 'calc-input') {
    var n = Math.min(parseNum(e.target.value), 999999999999); state.calc.amount = n;
    e.target.value = n ? fmt(n) : ''; updateCalc();
  } else if (id === 'rate-input') {
    var r = parseFloat(String(e.target.value).replace(',', '.'));
    if (r > 0 && r < 100000) { state.calc.manual = r; store.set('rateManual', r); updateRateUI(); }
  } else if (id === 'note-name' || id === 'note-addr' || id === 'note-memo') {
    state.notes[id.replace('note-', '')] = e.target.value; store.set('notes', state.notes);
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { var s = $('#note-status span'); if (s) s.textContent = store.ok ? t('savedNow') : t('savedOff'); }, 250);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.id === 'search' && e.key === 'Escape' && state.query) { state.query = ''; e.target.value = ''; updateSearchClear(); applyStatic(); renderMain(); return; }
  if (!modal) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (modal.type === 'deck') {
    if (e.key === 'ArrowRight') { e.preventDefault(); deckMove(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); deckMove(-1); }
    else if (e.key === '1') { e.preventDefault(); deckMark('again'); }
    else if (e.key === '2') { e.preventDefault(); deckMark('known'); }
    else if ((e.key === ' ' || e.key === 'Enter') && !(e.target && e.target.closest && e.target.closest('button, a, input, textarea'))) { e.preventDefault(); deckFlip(); }
  }
});

/* ================= hero illustration (original, drawn on canvas) ================= */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { var c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function shade(h, f) { var c = hexRgb(h).map(function (v) { return Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))); }); return 'rgb(' + c.join(',') + ')'; }
var LANTERN_COLORS = ['#e8322a', '#f08a24', '#f4be3e', '#d43d6e', '#ff6b3d', '#c81e3a', '#ffb23f', '#2fb39b', '#e8322a', '#f4be3e'];
function lantern(g, x, y, s, col) {
  g.strokeStyle = 'rgba(255,220,170,0.35)'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(x, y - s * 1.5); g.lineTo(x, y - s * 1.05); g.stroke();
  var gl = g.createRadialGradient(x, y, s * 0.3, x, y, s * 3.4);
  gl.addColorStop(0, rgba(col, 0.55)); gl.addColorStop(1, rgba(col, 0));
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, s * 3.4, 0, Math.PI * 2); g.fill();
  var bd = g.createRadialGradient(x - s * 0.2, y - s * 0.3, s * 0.1, x, y, s * 1.1);
  bd.addColorStop(0, '#fff3cf'); bd.addColorStop(0.38, col); bd.addColorStop(1, shade(col, -0.5));
  g.fillStyle = bd; g.beginPath(); g.ellipse(x, y, s * 0.88, s, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(70,15,0,0.28)'; g.lineWidth = 0.7;
  [0.38, 0.72].forEach(function (k) { g.beginPath(); g.ellipse(x, y, s * 0.88 * k, s, 0, 0, Math.PI * 2); g.stroke(); });
  g.fillStyle = '#c9932f';
  g.fillRect(x - s * 0.36, y - s * 1.08, s * 0.72, s * 0.18);
  g.fillRect(x - s * 0.3, y + s * 0.92, s * 0.6, s * 0.16);
  g.strokeStyle = rgba(col, 0.85); g.lineWidth = 1;
  g.beginPath(); g.moveTo(x, y + s * 1.08); g.lineTo(x, y + s * 1.85); g.stroke();
}
function drawHero() {
  var c = document.getElementById('hero-canvas'); if (!c || !c.getContext) return;
  var rect = c.getBoundingClientRect();
  var w = Math.max(320, Math.round(rect.width)), h = Math.max(240, Math.round(rect.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  var r = mulberry(20260101);

  var sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0a0d22'); sky.addColorStop(0.45, '#1d1030'); sky.addColorStop(0.72, '#3b1724'); sky.addColorStop(1, '#120a0b');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);

  var stars = Math.round(w * h / 1600);
  for (var i = 0; i < stars; i++) {
    var sx = r() * w, sy = r() * h * 0.55, sz = r() < 0.92 ? 1 : 1.7;
    g.fillStyle = 'rgba(255,236,200,' + (0.15 + r() * 0.6).toFixed(2) + ')'; g.fillRect(sx, sy, sz, sz);
  }

  var mx = w * 0.18, my = h * 0.2, mr = Math.max(12, h * 0.055);
  var mg = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 6);
  mg.addColorStop(0, 'rgba(255,214,150,0.32)'); mg.addColorStop(1, 'rgba(255,214,150,0)');
  g.fillStyle = mg; g.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
  g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(29,16,48,0.9)'; g.beginPath(); g.arc(mx + mr * 0.42, my - mr * 0.12, mr * 0.92, 0, Math.PI * 2); g.fill();

  var base = h * 0.74, x = -30, wins = [];
  while (x < w + 30) {
    var bw = 54 + r() * 96, wallH = h * (0.08 + r() * 0.09), roofH = h * (0.045 + r() * 0.04), top = base - wallH;
    g.fillStyle = '#1b0f13'; g.fillRect(x, top, bw, h - top);
    g.fillStyle = '#120a0d';
    g.beginPath(); g.moveTo(x - 10, top + 5); g.quadraticCurveTo(x - 2, top + 1, x + bw * 0.16, top - roofH);
    g.lineTo(x + bw * 0.84, top - roofH); g.quadraticCurveTo(x + bw + 2, top + 1, x + bw + 10, top + 5); g.closePath(); g.fill();
    g.fillStyle = 'rgba(244,190,62,0.18)'; g.fillRect(x + bw * 0.16, top - roofH, bw * 0.68, 1.2);
    var cols = Math.max(1, Math.floor(bw / 30));
    for (var k = 0; k < cols; k++) {
      if (r() < 0.6) {
        var wx = x + 8 + k * ((bw - 16) / cols) + 3, wy = top + wallH * (0.25 + r() * 0.2), ww = Math.min(12, (bw - 16) / cols - 6), wh = Math.min(16, wallH * 0.35);
        wins.push([wx + ww / 2, wy + wh / 2]);
        var wg = g.createRadialGradient(wx + ww / 2, wy + wh / 2, 1, wx + ww / 2, wy + wh / 2, 22);
        wg.addColorStop(0, 'rgba(255,170,80,0.35)'); wg.addColorStop(1, 'rgba(255,170,80,0)');
        g.fillStyle = wg; g.fillRect(wx - 20, wy - 20, ww + 40, wh + 40);
        g.fillStyle = r() < 0.5 ? '#ffb85c' : '#f4be3e'; g.fillRect(wx, wy, ww, wh);
      }
    }
    x += bw + 2 + r() * 8;
  }

  var rv = g.createLinearGradient(0, base, 0, h);
  rv.addColorStop(0, '#1b1020'); rv.addColorStop(1, '#07060b');
  g.fillStyle = rv; g.fillRect(0, base, w, h - base);
  wins.forEach(function (p) {
    var rg = g.createLinearGradient(0, base, 0, base + (h - base) * 0.8);
    rg.addColorStop(0, 'rgba(255,180,90,0.22)'); rg.addColorStop(1, 'rgba(255,180,90,0)');
    g.fillStyle = rg; g.fillRect(p[0] - 2, base + 2, 4, (h - base) * 0.8);
  });
  for (var f = 0; f < Math.round(w / 90); f++) {
    var fx = r() * w, fy = base + 8 + r() * (h - base) * 0.5, col = LANTERN_COLORS[Math.floor(r() * LANTERN_COLORS.length)];
    var fg = g.createRadialGradient(fx, fy, 0.5, fx, fy, 14); fg.addColorStop(0, rgba(col, 0.75)); fg.addColorStop(1, rgba(col, 0));
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff1c4'; g.fillRect(fx - 1.5, fy - 1.5, 3, 3);
  }

  var rows = h < 300 ? 2 : 3;
  for (var row = 0; row < rows; row++) {
    var y0 = h * (0.03 + row * 0.12), sag = h * (0.07 + row * 0.015), spacing = 50 + row * 12;
    var span = 380 + r() * 220, start = -r() * span;
    for (var s0 = start; s0 < w + 40; s0 += span) {
      var e0 = s0 + span, cx = (s0 + e0) / 2, cy = y0 + sag * 2;
      g.strokeStyle = 'rgba(255,220,170,0.22)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(s0, y0); g.quadraticCurveTo(cx, cy, e0, y0); g.stroke();
      var n = Math.max(3, Math.floor(span / spacing));
      for (var q = 1; q < n; q++) {
        var tq = q / n, u = 1 - tq;
        var px = u * u * s0 + 2 * u * tq * cx + tq * tq * e0, py = u * u * y0 + 2 * u * tq * cy + tq * tq * y0;
        var size = h * 0.026 * (1.25 - row * 0.22) * (0.8 + r() * 0.5);
        lantern(g, px, py + size * 1.6 + r() * 4, size, LANTERN_COLORS[Math.floor(r() * LANTERN_COLORS.length)]);
      }
    }
  }

  var vg = g.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.3, w / 2, h * 0.45, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}
var heroRaf = 0, lastSize = '';
function drawHeroSoon() {
  cancelAnimationFrame(heroRaf);
  heroRaf = requestAnimationFrame(function () {
    var c = document.getElementById('hero-canvas'); if (!c) return;
    var key = Math.round(c.clientWidth) + 'x' + Math.round(c.clientHeight);
    if (key === lastSize) return; lastSize = key; drawHero();
  });
}

/* ================= boot ================= */
hydrate(document);
applyStatic();
renderMain();
updateSearchClear();
drawHero(); lastSize = Math.round($('#hero-canvas').clientWidth) + 'x' + Math.round($('#hero-canvas').clientHeight);
startLiveRate();
if (window.ResizeObserver) { new ResizeObserver(drawHeroSoon).observe($('#hero-canvas')); } else { window.addEventListener('resize', drawHeroSoon); }
})();
</script>
