      { vi: 'Ghẹ Hàm Ninh', ko: '함닌 꽃게', d: { ko: '동쪽 어촌 함닌의 살이 단 꽃게. 주로 쪄서 먹어요', en: 'Sweet crab from Hàm Ninh fishing village on the east coast, usually steamed' }, dish: '' },

  { id: 'hanoi', emoji: '🍜', aka: '하노이 hanoi ha noi', k: '하노이 하롱베이 하롱 구시가지 hanoi ha noi ha long halong',

    tagline: { ko: '천 년 고도의 골목과 바다 위 석회암 섬들을 함께 만나는 베트남 북부 여행', en: 'Old lanes of a thousand-year-old capital, paired with limestone islands rising from the sea' },
    info: [

      { k: 'airport', ko: '공항에서 구시가지(호안끼엠)까지 약 30km, 차로 40분~1시간. Grab·Xanh SM은 약 30만~40만 동(약 {krw:300000}~{krw:400000}), 86번 공항버스는 4만 5천 동(약 {krw:45000})이에요.', en: 'The Old Quarter (Hoàn Kiếm) is about 30 km away, 40 minutes to an hour by car. Grab or Xanh SM costs about VND 300,000–400,000 ({krw:300000}–{krw:400000}); airport bus 86 is VND 45,000 ({krw:45000}).' },
      { k: 'season', ko: '10~11월과 3~4월이 선선해서 가장 좋아요. 5~9월은 덥고 비가 잦으며 7~9월엔 태풍으로 하롱베이 크루즈가 멈추기도 하고, 12~2월은 쌀쌀해 겉옷이 필요해요.', en: 'October–November and March–April are the most pleasant. May–September is hot and rainy, and typhoons can halt Hạ Long Bay cruises in July–September; December–February is chilly, so bring a jacket.' },
      { k: 'days', ko: '보통 3박 4일~3박 5일이에요. 하노이 시내 1~2일에 하롱베이 당일 투어(고속도로로 편도 2시간 30분~3시간)나 1박 크루즈를 더해요.', en: 'Usually 3–4 nights: 1–2 days in Hanoi plus a Hạ Long Bay day trip (2.5–3 hours each way on the expressway) or an overnight cruise.' },
      { k: 'stay', ko: '구시가지(호안끼엠)는 걸어 다니기 좋지만 밤늦게까지 시끄러운 편이에요. 호수 남동쪽 프렌치 쿼터는 조용한 고급 호텔가, 서호(떠이호)는 호숫가 카페가 많은 한적한 동네예요(구시가지까지 차로 15~25분).', en: 'The walkable Old Quarter (Hoàn Kiếm) can be noisy late at night. The French Quarter southeast of the lake is quieter with upscale hotels, and West Lake (Tây Hồ) is a relaxed lakeside area full of cafés, 15–25 minutes from the Old Quarter by car.' },
      { k: 'move', ko: '구시가지는 걸어서, 먼 곳은 Grab이나 전기 택시 Xanh SM 앱으로 다녀요. 길을 건널 땐 뛰거나 멈추지 말고 같은 속도로 천천히 걸으면 오토바이가 피해 가요.', en: 'Walk around the Old Quarter and use Grab or the Xanh SM electric-taxi app for longer trips. To cross a street, walk slowly at a steady pace without running or stopping, and motorbikes will flow around you.' }
    ],
    eats: [
      { vi: 'Phở bò', ko: '퍼보', d: { ko: '맑은 소고기 육수에 말아 낸 하노이식 쌀국수', en: 'Hanoi-style beef noodle soup in a clear broth' }, dish: 'phobo' },
      { vi: 'Bún chả', ko: '분짜', d: { ko: '숯불 돼지고기와 쌀국수를 새콤달콤한 국물에 찍어 먹는 하노이 명물', en: 'Charcoal-grilled pork and rice noodles dipped in a sweet-sour broth' }, dish: 'buncha' },
      { vi: 'Chả cá Lã Vọng', ko: '짜까 라봉', d: { ko: '강황에 재운 생선을 딜과 함께 구워 쌀국수와 먹는 요리', en: 'Turmeric-marinated fish sizzled with dill, eaten with rice noodles' }, dish: '' },
      { vi: 'Cà phê trứng', ko: '에그 커피', d: { ko: '달걀노른자 크림을 듬뿍 얹은 하노이식 커피', en: 'Coffee topped with whipped egg-yolk cream' }, dish: 'caphetrung' }
    ],
    tips: [
      { ko: '기찻길 카페 거리(Train Street)는 공식적으로 출입 금지라 입구를 막아 두기도 해요. 그래도 들어간다면 선로에 바짝 붙어 앉거나 서지 마세요.', en: 'Train Street is officially off-limits and the entrances are sometimes blocked. If you do go in, never sit or stand right next to the tracks.' },
      { ko: '공항 도착 홀에서 "Grab?" 하며 다가오는 사람은 따라가지 마세요. 앱으로 부른 차의 번호판을 확인하고 타요.', en: 'Ignore people offering "Grab?" in the arrivals hall. Book in the app and check the license plate before you get in.' }
    ] },
  { id: 'hcmc', emoji: '🛵', aka: '호치민 호찌민 사이공 hcmc ho chi minh saigon sai gon', k: '호치민 호찌민 사이공 hcmc ho chi minh saigon',
    name: { ko: '호치민', en: 'Ho Chi Minh City' }, vi: 'TP. Hồ Chí Minh (Sài Gòn)',
    tagline: { ko: '오토바이 물결 속에 프랑스풍 건물과 고층 빌딩이 어우러진 베트남 최대 도시', en: "Vietnam's largest city, where French colonial buildings and skyscrapers rise above a sea of motorbikes" },
    info: [
      { k: 'fly', ko: '인천에서 직항 약 5시간 30분, 떤선녓 국제공항(SGN)에 도착해요. 부산 출발 직항도 있고, 2026년 12월 개항 예정인 롱탄 신공항으로 국제선이 차례로 옮겨 갈 예정이라 항공권의 도착 공항을 꼭 확인하세요.', en: 'About 5.5 hours nonstop from Incheon to Tân Sơn Nhất International Airport (SGN), with direct flights from Busan too. The new Long Thành airport is due to open in December 2026 and international flights will move there in phases, so check which airport your ticket uses.' },
      { k: 'airport', ko: '공항에서 1군 벤탄 시장까지 약 7~8km, 차로 25~45분이에요(출퇴근 시간엔 더 걸려요). Grab은 약 12만~25만 동(약 {krw:120000}~{krw:250000})으로 시간대에 따라 달라지고, 109번 버스(1만 5천~2만 동)는 2025년부터 국제선 T2가 아닌 국내선 T3 쪽에서 타요.', en: 'Bến Thành Market in District 1 is about 7–8 km away, 25–45 minutes by car (longer at rush hour). Grab costs about VND 120,000–250,000 ({krw:120000}–{krw:250000}) depending on the time; bus 109 (VND 15,000–20,000) now leaves from the domestic Terminal 3 side, not the international terminal (T2).' },
      { k: 'season', ko: '건기인 12~4월이 여행하기 좋고, 그중 12~2월이 덜 더워요. 5~11월 우기에는 오후에 짧고 굵은 스콜이 자주 오고, 4월은 한낮 34도를 넘을 만큼 더워요.', en: 'The dry season, December to April, is the best time to go, and December to February is the least hot. May to November is the rainy season, with short, heavy afternoon downpours; April is the hottest month, often above 34°C at midday.' },
      { k: 'days', ko: '시내만 보면 2~3일이면 충분해요. 구찌 터널·메콩강 같은 근교 투어까지 하려면 4박 5일 정도가 좋아요.', en: 'Two or three days cover the city. Allow about 4 nights and 5 days if you add day trips such as the Củ Chi Tunnels and the Mekong Delta.' },
      { k: 'stay', ko: '처음이면 벤탄 시장·응우옌후에 거리 주변의 1군이 걸어 다니기 좋아요. 부이비엔 거리 근처는 밤늦게까지 시끄럽고, 조용한 곳을 원하면 카페가 많은 3군이나 강 건너 타오디엔(옛 2군)이 좋아요.', en: 'First-timers do best in District 1 around Bến Thành Market and Nguyễn Huệ Street, where the sights are walkable. Streets near Bùi Viện are loud late into the night; for somewhere calmer, try café-filled District 3 or Thảo Điền across the river (former District 2).' },
      { k: 'move', ko: 'Grab이나 전기 택시 앱 Xanh SM으로 부르면 편하고, 1군 중심가는 걸어서 다닐 만해요. 2024년 12월 개통한 메트로 1호선(벤탄~수오이띠엔)은 1회 7천~2만 동(약 {krw:7000}~{krw:20000})이고 타오디엔에 갈 때 편해요.', en: 'Grab or the Xanh SM electric-taxi app is easiest, and central District 1 is walkable. Metro Line 1 (Bến Thành–Suối Tiên), opened in December 2024, costs VND 7,000–20,000 a ride ({krw:7000}–{krw:20000}) and is handy for Thảo Điền.' }
    ],
    eats: [
      { vi: 'Cơm tấm', ko: '껌떰', d: { ko: '잘게 부서진 쌀밥에 숯불 돼지갈비를 올린 덮밥', en: 'Broken rice topped with a charcoal-grilled pork chop' }, dish: 'comtam' },
      { vi: 'Hủ tiếu', ko: '후띠우', d: { ko: '돼지 뼈 육수에 쌀국수와 새우·돼지고기를 넣은 남부식 국수', en: 'Southern rice-noodle soup with pork broth, shrimp and pork' }, dish: '' },
      { vi: 'Bánh mì', ko: '반미', d: { ko: '바삭한 바게트에 고기·파테·채소 절임을 채운 샌드위치', en: 'Crisp baguette filled with meats, pâté and pickled vegetables' }, dish: 'banhmi' },
      { vi: 'Bánh xèo', ko: '반쎄오', d: { ko: '새우·숙주를 넣고 크게 부친 바삭한 부침개, 채소에 싸 먹어요', en: 'Large crispy crêpe with shrimp and bean sprouts, wrapped in greens' }, dish: 'banhxeo' } ],
    tips: [
      { ko: '2025년 7월 행정 개편으로 군(quận)이 없어져, 새 주소에는 1군 대신 사이공동·벤탄동 같은 동(phường) 이름이 쓰여요. 그래도 현지와 여행 정보에서는 아직 1군·3군이라는 말을 많이 써요.', en: 'Since a July 2025 reform, districts (quận) no longer exist, so new addresses use ward names such as Sài Gòn or Bến Thành instead of District 1. Locals and travel guides still often say District 1 or District 3.' },
      { ko: '오토바이 날치기가 있으니 길에서 휴대폰을 오래 꺼내 들지 말고, 가방은 차도 반대쪽으로 메세요. 부이비엔처럼 붐비는 밤거리에서는 특히 조심하세요.', en: 'Motorbike snatch thefts happen, so do not hold your phone out on the street for long and carry your bag on the side away from traffic. Take extra care on busy nightlife streets like Bùi Viện.' } ] },
  { id: 'dalat', emoji: '🌲', aka: '달랏 다랏 dalat da lat', k: '달랏 다랏 dalat da lat',
    name: { ko: '달랏', en: 'Đà Lạt' }, vi: 'Đà Lạt',
    tagline: { ko: '소나무 숲과 호수에 둘러싸인, 1년 내내 선선한 해발 1,500m 고원 도시', en: 'A cool highland town of pine forests and lakes, about 1,500 m above sea level' },
    info: [
      { k: 'fly', ko: '인천 직항(약 5시간)은 리엔크엉 공항(DLI) 공사로 멈췄다가 2026년 12월부터 주 4회 재개될 예정이에요. 직항이 없을 땐 나트랑 깜라인 공항(CXR)에서 차로 3~4시간, 또는 호치민에서 국내선(약 1시간)으로 가요.', en: "Direct flights from Incheon (about 5 hours) to Liên Khương Airport (DLI) were halted by runway works and are due to resume in December 2026, about four a week. Otherwise fly to Nha Trang's Cam Ranh Airport (CXR) and drive 3–4 hours, or connect in Ho Chi Minh City (about 1 hour)." },
      { k: 'airport', ko: '공항에서 시내까지 약 30km, 차로 30~40분이에요. Grab·택시는 약 25만~35만 동(약 {krw:250000}~{krw:350000}), 공항버스는 약 4만~6만 동이에요.', en: 'The airport is about 30 km from town, 30–40 minutes by car. Grab or a taxi costs about VND 250,000–350,000 ({krw:250000}–{krw:350000}); the airport bus is about VND 40,000–60,000.' },
      { k: 'season', ko: '건기인 11~4월이 여행하기 좋고, 5~10월 우기엔 오후에 소나기가 자주 와요. 1년 내내 낮 20~25도, 밤 12~16도(12~2월엔 10도 안팎) 정도로 선선해서 겉옷이 꼭 필요해요.', en: 'The dry season (November–April) is best; from May to October expect frequent afternoon showers. It is cool all year, about 20–25°C by day and 12–16°C at night (around 10°C in December–February), so bring a jacket.' },
      { k: 'days', ko: '달랏만 가면 3박 4일, 나트랑과 묶으면 4박 5일 이상이 많아요. 하루는 시내(쑤언흐엉 호수·야시장·크레이지 하우스), 하루는 근교(랑비앙산·다딴라 폭포·린프억 사원)를 돌면 좋아요.', en: 'Three nights is typical for Đà Lạt alone, four or more when combined with Nha Trang. Spend one day in town (Xuân Hương Lake, night market, Crazy House) and one on the outskirts (Langbiang, Datanla Falls, Linh Phước Pagoda).' },
      { k: 'stay', ko: '쑤언흐엉 호수와 달랏 시장(야시장) 주변이 걸어 다니기 편하고 식당·카페가 많아요. 조용히 쉬고 싶다면 소나무 숲 속 뚜옌럼 호수(Hồ Tuyền Lâm) 쪽 리조트나 언덕 위 빌라형 숙소도 좋아요.', en: 'Around Xuân Hương Lake and Đà Lạt Market (the night market) is walkable, with plenty of restaurants and cafés. For peace and quiet, pick a resort by Tuyền Lâm Lake in the pine forest or a villa-style stay on the hills.' },
      { k: 'move', ko: '시내 중심은 걸어 다닐 만하지만 언덕길이 많아요. 조금 먼 곳은 Grab이나 택시(Mai Linh·Lado 등)를 타고, 경사와 급커브가 많아 오토바이 렌트는 초보자에게 권하지 않아요.', en: 'The center is walkable but hilly. Use Grab or taxis (Mai Linh, Lado and others) for longer trips; steep, winding roads make motorbike rental a poor choice for beginners.' }
    ],
    eats: [
      { vi: 'Bánh tráng nướng', ko: '반짱느엉', d: { ko: '라이스페이퍼에 달걀·파 등을 얹어 숯불에 바삭하게 구운 간식, 일명 베트남 피자', en: 'Rice paper topped with egg and scallions, grilled crisp over charcoal; nicknamed Vietnamese pizza' }, dish: '' },
      { vi: 'Bánh căn', ko: '반깐', d: { ko: '토기 틀에 구운 한입 크기 쌀 팬케이크, 미트볼 국물(xíu mại)에 찍어 먹어요', en: 'Bite-size rice cakes baked in clay molds, dipped in meatball (xíu mại) broth' }, dish: '' },
      { vi: 'Lẩu gà lá é', ko: '러우가라에', d: { ko: '향긋하고 살짝 매콤한 허브 라에(lá é)를 듬뿍 넣은 닭고기 전골', en: 'Chicken hotpot loaded with lá é, a fragrant, peppery basil' }, dish: '' },
      { vi: 'Sữa đậu nành', ko: '쓰어더우나잉', d: { ko: '쌀쌀한 밤 야시장에서 따뜻하게 마시는 두유', en: 'Hot soy milk, the night-market drink for chilly evenings' }, dish: '' } ],
    tips: [
      { ko: '기념품으로는 달랏 특산품인 아티초크 차와 과일 당절임(mứt)이 인기예요. 달랏 시장과 야시장에서 쉽게 살 수 있어요.', en: 'Popular souvenirs are artichoke tea, a local specialty, and candied fruit (mứt), easy to find at Đà Lạt Market and the night market.' },
      { ko: '2025년 7월 행정구역 개편으로 달랏 주소가 Phường 1 같은 숫자 동 대신 Xuân Hương - Đà Lạt 같은 새 이름으로 바뀌었어요. 옛 주소와 섞여 쓰이니 Grab이나 지도에선 호텔·가게 이름으로 검색하세요.', en: 'Since a July 2025 reorganization, Đà Lạt addresses use new ward names such as Xuân Hương - Đà Lạt instead of numbered wards like Phường 1. Old and new addresses are both in use, so search by hotel or shop name in Grab and maps.' } ] }

  { id: 'hn_halongcruise', city: 'hanoi', time: 'day', emoji: '🛳️', area: { ko: '하롱베이 (근교)', en: 'Hạ Long Bay (day trip)' },

    tips: [

  { id: 'hn_vanmieu', city: 'hanoi', time: 'day', emoji: '🏛️', area: { ko: '시내', en: 'Central Hanoi' },

  { id: 'sg_cuchi', city: 'hcmc', time: 'day', emoji: '🕳️', area: { ko: '근교 (구찌)', en: 'Day trip (Củ Chi)' },

    vi: 'Địa đạo Củ Chi',
    dur: { ko: '반나절 투어 6~8시간 (왕복 이동 포함)', en: 'Half-day tour, 6–8 hours including the drive' },
    desc: { ko: '베트남 전쟁 때 게릴라들이 판, 총길이 200km가 넘는 지하 땅굴이에요. 좁은 굴을 직접 기어 보고 함정과 생활 흔적을 둘러본 뒤, 게릴라들이 먹던 삶은 카사바를 맛보는 투어가 많아요.', en: 'A network of more than 200 km of tunnels dug by guerrillas during the Vietnam War. Crawl through a narrow stretch, see traps and traces of underground life, and on most tours taste the boiled cassava the fighters lived on.' },

    price: { ko: '외국인 입장료 13만 5천 동(약 {krw:135000}) · 반나절 단체 투어 약 1만 9천 원부터(온라인 예약가) · 스피드보트 투어 1인 약 $85~120 · 사격은 별도 요금', en: 'Foreign visitors VND 135,000 (about {krw:135000}); half-day group tours from about ₩19,000 online; speedboat tours about $85–120 per person; shooting costs extra' },

    tips: [

function searchView(q) {
  var accented = /[\u0300-\u036f]/.test(q.normalize('NFD')) || /đ/i.test(q);
  var prep = accented ? function (x) { return String(x || '').toLowerCase().normalize('NFC').replace(/\s+/g, ' ').trim(); } : norm;
  var nq = prep(q), qTokens = nq.split(' ');
  // Latin queries match from the start of a word, so "atm" does not hit "boatmen" and "ice" does not hit "rice"
  var latin = /^[a-z]/.test(nq);
  var hit = function (fields) {
    var s = prep(fields.join(' ')), i = s.indexOf(nq);
    if (!latin) return i >= 0;
    for (; i >= 0; i = s.indexOf(nq, i + 1)) if (i === 0 || !/[a-z0-9]/.test(s.charAt(i - 1))) return true;
    return false;
  };
  var ph = PHRASES.filter(function (p) { return hit([p.ko[0], p.ko[1], p.en, p.vi[0], p.vi[1], p.pr[0], p.pr[1], p.k, p.note ? p.note.ko + ' ' + p.note.en : '']); });
  var ds = DISHES.filter(function (d) { return hit([d.vi, d.ko, d.en, d.pr, d.k, d.d.ko, d.d.en]); });
  var es = EXPERIENCES.filter(function (x) { var c = cityById(x.city); return hit([x.name.ko, x.name.en, x.vi, x.desc.ko, x.desc.en, x.k, x.area ? x.area.ko + ' ' + x.area.en : '', c.aka]); });
  var cs = CITIES.filter(function (c) { return hit([c.name.ko, c.name.en, c.vi, c.k]); });
  var ss = SPOTS.filter(function (x) { return hit([x.name.ko, x.name.en, x.vi, x.d.ko, x.d.en, x.addr, x.k, cityById(x.city).aka]); });
  var ws = [];
  WORDS.forEach(function (g) { g.items.forEach(function (w) { if (hit([w.vi, w.ko, w.en, w.pr])) ws.push(w); }); });
  var us = MONEY_UNITS.filter(function (m) { return hit([m.u, m.say, m.pr, m.k]); });
  var tabs = Object.keys(TAB_KEYS).filter(function (k) {
    var words = prep(TAB_KEYS[k]).split(' ');
    return words.some(function (w) {
      if (!w) return false;
      if (latin ? w.indexOf(nq) === 0 : w.indexOf(nq) >= 0) return true;
      if (nq.length < 2) return false;
      // the query contains a keyword: Latin keywords (3+ letters) and one-syllable Korean ones (동·원·돈·팁) only at the start of a word, so 소원 does not open the calculator
      if (/^[a-z]+$/.test(w)) return w.length >= 3 && (' ' + nq).indexOf(' ' + w) >= 0;
      // accented Vietnamese keywords (money slang like củ, xị) count only next to a number, so "Củ Chi" does not open the calculator
      if (/[a-z]/.test(w)) return /\d/.test(nq) && (' ' + nq).indexOf(' ' + w) >= 0;
      return w.normalize('NFC').length > 1 ? nq.indexOf(w) >= 0 : qTokens.some(function (tok) { return tok.indexOf(w) === 0; });
    });
  });
  if (cs.length) tabs = tabs.filter(function (k) { return k !== 'exp'; });
  var total = es.length + ss.length + ph.length + ds.length + ws.length + us.length;
  var box = function (emoji, title, n, inner) {
    return '<div class="bg-background-100 p-5 rounded-2xl border border-background-200 space-y-3"><h3 class="font-heading font-bold text-foreground-950 text-base flex items-center gap-2"><span aria-hidden="true">' + emoji + '</span>' + esc(title) + ' <span class="text-xs text-foreground-400 tabular">' + n + '</span></h3>' + inner + '</div>';
  };
  var tabIcon = { exp: 'ri-compass-3-line', calc: 'ri-calculator-line', culture: 'ri-ancient-gate-line', emergency: 'ri-shield-star-line', prep: 'ri-suitcase-line' };
  var html = '<section class="space-y-6"><div class="flex flex-wrap items-center justify-between gap-3"><p class="text-sm text-foreground-500">' + esc(tf('results', { q: q, n: total })) + '</p>' +
    '<button type="button" data-action="clear-search" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-background-100 hover:bg-background-200 border border-background-200 text-xs font-semibold text-foreground-500 hover:text-foreground-900 cursor-pointer transition-colors"><i class="ri-close-line"></i>' + esc(t('clearSearch')) + '</button></div>';
  if (cs.length || tabs.length) {
    html += '<div class="flex flex-wrap gap-2">' + cs.map(function (c) {
      return '<button type="button" data-action="exp-city-go" data-value="' + c.id + '" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-accent-500/10 hover:bg-accent-500/20 border border-accent-500/30 text-accent-400 text-sm font-bold cursor-pointer transition-colors"><span aria-hidden="true">' + c.emoji + '</span>' + esc(L(c.name)) + ' <span class="text-xs font-semibold text-foreground-500">' + esc(t('cityGo')) + '</span><i class="ri-arrow-right-line"></i></button>';
    }).join('') + tabs.map(function (k) {
      return '<button type="button" data-action="goto-tab" data-value="' + k + '" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-accent-500/10 hover:bg-accent-500/20 border border-accent-500/30 text-accent-400 text-sm font-bold cursor-pointer transition-colors"><i class="' + tabIcon[k] + ' text-base"></i>' + esc(t('tab_' + k)) + ' <span class="text-xs font-semibold text-foreground-500">' + esc(t('goTab')) + '</span><i class="ri-arrow-right-line"></i></button>';
    }).join('') + '</div>';
  }
  var sec = {
    es: es.length ? box('🏮', t('secExp'), es.length, '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">' + es.map(function (x) { return expCard(x, true); }).join('') + '</div>') : '',
    ss: ss.length ? box('📍', t('secSpots'), ss.length, '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + ss.map(function (x) { return spotCard(x, true); }).join('') + '</div>') : '',
    ph: ph.length ? box('💬', t('secPhrases'), ph.length, toneSeg() + '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + ph.map(phraseCard).join('') + '</div>') : '',
    ds: ds.length ? box('🍜', t('secDishes'), ds.length, '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">' + ds.map(dishCard).join('') + '</div>') : '',
    ws: ws.length ? box('📖', t('secWords'), ws.length, '<div class="flex flex-wrap gap-2">' + ws.map(wordChip).join('') + '</div>') : '',
    us: us.length ? box('🗣️', t('secUnits'), us.length, '<div class="space-y-2">' + us.map(unitRow).join('') + '</div>') : ''
  };
  // a query that starts a dish name (pho, bun, banh mi, 반미) is a menu search: show the menu first, not experiences that mention "photos" or "phố"
  var dishFirst = ds.some(function (d) { return prep(d.vi).indexOf(nq) === 0 || prep(d.ko).indexOf(nq) === 0; });
  html += (dishFirst ? ['ds', 'ws', 'es', 'ss', 'ph', 'us'] : ['ss', 'es', 'ph', 'ds', 'ws', 'us']).map(function (k) { return sec[k]; }).join('');
  if (!total && !tabs.length && !cs.length) {
    html += '<div class="bg-background-100 p-8 rounded-2xl border border-background-200 text-center space-y-3"><p class="text-3xl" aria-hidden="true">🔍</p><p class="font-heading font-bold text-foreground-950">' + esc(t('noResults')) + '</p><p class="text-xs text-foreground-400">' + esc(t('tryThese')) + '</p>' +
      '<div class="flex flex-wrap justify-center gap-2">' + t('sugg').map(function (s) { return chip('suggest', s, s, false); }).join('') + '</div></div>';
  }
  return html + '</section>';
}

      openModal('big', { label: t('showDriver'), title: 'Làm ơn chở tôi đến địa chỉ này:', vi: state.notes.addr, sub: state.notes.name, meaning: t('driverMeaning'), speak: 'Làm ơn chở tôi đến địa chỉ này. ' + state.notes.addr }); break;
    case 'clear-search': state.query = ''; $('#search').value = ''; updateSearchClear(); applyStatic(); renderMain(); $('#search').focus(); break;

    case 'card-next': deckMove(1); break;

    case 'card-shuffle':

      state.deck.order = ids; state.deck.cur = ids[0] || null; state.deck.flipped = false; renderModal(); break;
    case 'deck-src': state.deck.source = v; state.deck.order = null; state.deck.cur = null; state.deck.flipped = false; state.deck.resetArmed = false; renderModal(); break;
    case 'deck-hide': state.deck.hideKnown = !state.deck.hideKnown; store.set('deckHideKnown', state.deck.hideKnown); state.deck.resetArmed = false; renderModal(); break;
    case 'deck-reset': deckReset(); break;

      state.prep.resetArmed = false; store.set('prepChecks', state.prep.checks);
      var it = null; PREP_CHECK.forEach(function (g) { g.items.forEach(function (x) { if (x.id === v) it = x; }); });
      if (it) {

      state.prep.checks = {}; state.prep.resetArmed = false; store.set('prepChecks', {}); renderMain(); toast(t('prep_resetDone'), 'ri-refresh-line');
      break;
  }
});

var noteTimer = null;

document.addEventListener('keydown', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'radio' && e.target.hasAttribute('data-action')) { e.preventDefault(); e.target.click(); return; }
  if (e.target && e.target.id === 'search' && e.key === 'Escape' && state.query) { state.query = ''; e.target.value = ''; updateSearchClear(); applyStatic(); renderMain(); return; }
  if (!modal) return;

  }
});

/* ================= hero illustration (original, drawn on canvas) ================= */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { var c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function shade(h, f) { var c = hexRgb(h).map(function (v) { return Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))); }); return 'rgb(' + c.join(',') + ')'; }
var LANTERN_COLORS = ['#e8322a', '#f08a24', '#f4be3e', '#d43d6e', '#ff6b3d', '#c81e3a', '#ffb23f', '#2fb39b', '#e8322a', '#f4be3e'];
function lantern(g, x, y, s, col) {
  g.strokeStyle = 'rgba(255,220,170,0.35)'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(x, y - s * 1.5); g.lineTo(x, y - s * 1.05); g.stroke();
  var gl = g.createRadialGradient(x, y, s * 0.3, x, y, s * 3.4);
  gl.addColorStop(0, rgba(col, 0.55)); gl.addColorStop(1, rgba(col, 0));
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, s * 3.4, 0, Math.PI * 2); g.fill();
  var bd = g.createRadialGradient(x - s * 0.2, y - s * 0.3, s * 0.1, x, y, s * 1.1);
  bd.addColorStop(0, '#fff3cf'); bd.addColorStop(0.38, col); bd.addColorStop(1, shade(col, -0.5));
  g.fillStyle = bd; g.beginPath(); g.ellipse(x, y, s * 0.88, s, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(70,15,0,0.28)'; g.lineWidth = 0.7;
  [0.38, 0.72].forEach(function (k) { g.beginPath(); g.ellipse(x, y, s * 0.88 * k, s, 0, 0, Math.PI * 2); g.stroke(); });
  g.fillStyle = '#c9932f';
  g.fillRect(x - s * 0.36, y - s * 1.08, s * 0.72, s * 0.18);
  g.fillRect(x - s * 0.3, y + s * 0.92, s * 0.6, s * 0.16);
  g.strokeStyle = rgba(col, 0.85); g.lineWidth = 1;
  g.beginPath(); g.moveTo(x, y + s * 1.08); g.lineTo(x, y + s * 1.85); g.stroke();
}
function drawHero() {
  var c = document.getElementById('hero-canvas'); if (!c || !c.getContext) return;
  var rect = c.getBoundingClientRect();
  var w = Math.max(320, Math.round(rect.width)), h = Math.max(240, Math.round(rect.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  var r = mulberry(20260101);

  var sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0a0d22'); sky.addColorStop(0.45, '#1d1030'); sky.addColorStop(0.72, '#3b1724'); sky.addColorStop(1, '#120a0b');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);

  var stars = Math.round(w * h / 1600);
  for (var i = 0; i < stars; i++) {
    var sx = r() * w, sy = r() * h * 0.55, sz = r() < 0.92 ? 1 : 1.7;
    g.fillStyle = 'rgba(255,236,200,' + (0.15 + r() * 0.6).toFixed(2) + ')'; g.fillRect(sx, sy, sz, sz);
  }

  var mx = w * 0.18, my = h * 0.2, mr = Math.max(12, h * 0.055);
  var mg = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 6);
  mg.addColorStop(0, 'rgba(255,214,150,0.32)'); mg.addColorStop(1, 'rgba(255,214,150,0)');
  g.fillStyle = mg; g.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
  g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(29,16,48,0.9)'; g.beginPath(); g.arc(mx + mr * 0.42, my - mr * 0.12, mr * 0.92, 0, Math.PI * 2); g.fill();

  var base = h * 0.74, x = -30, wins = [];
  while (x < w + 30) {
    var bw = 54 + r() * 96, wallH = h * (0.08 + r() * 0.09), roofH = h * (0.045 + r() * 0.04), top = base - wallH;
    g.fillStyle = '#1b0f13'; g.fillRect(x, top, bw, h - top);
    g.fillStyle = '#120a0d';
    g.beginPath(); g.moveTo(x - 10, top + 5); g.quadraticCurveTo(x - 2, top + 1, x + bw * 0.16, top - roofH);
    g.lineTo(x + bw * 0.84, top - roofH); g.quadraticCurveTo(x + bw + 2, top + 1, x + bw + 10, top + 5); g.closePath(); g.fill();
    g.fillStyle = 'rgba(244,190,62,0.18)'; g.fillRect(x + bw * 0.16, top - roofH, bw * 0.68, 1.2);
    var cols = Math.max(1, Math.floor(bw / 30));
    for (var k = 0; k < cols; k++) {
      if (r() < 0.6) {
        var wx = x + 8 + k * ((bw - 16) / cols) + 3, wy = top + wallH * (0.25 + r() * 0.2), ww = Math.min(12, (bw - 16) / cols - 6), wh = Math.min(16, wallH * 0.35);
        wins.push([wx + ww / 2, wy + wh / 2]);
        var wg = g.createRadialGradient(wx + ww / 2, wy + wh / 2, 1, wx + ww / 2, wy + wh / 2, 22);
        wg.addColorStop(0, 'rgba(255,170,80,0.35)'); wg.addColorStop(1, 'rgba(255,170,80,0)');
        g.fillStyle = wg; g.fillRect(wx - 20, wy - 20, ww + 40, wh + 40);
        g.fillStyle = r() < 0.5 ? '#ffb85c' : '#f4be3e'; g.fillRect(wx, wy, ww, wh);
      }
    }
    x += bw + 2 + r() * 8;
  }

  var rv = g.createLinearGradient(0, base, 0, h);
  rv.addColorStop(0, '#1b1020'); rv.addColorStop(1, '#07060b');
  g.fillStyle = rv; g.fillRect(0, base, w, h - base);
  wins.forEach(function (p) {
    var rg = g.createLinearGradient(0, base, 0, base + (h - base) * 0.8);
    rg.addColorStop(0, 'rgba(255,180,90,0.22)'); rg.addColorStop(1, 'rgba(255,180,90,0)');
    g.fillStyle = rg; g.fillRect(p[0] - 2, base + 2, 4, (h - base) * 0.8);
  });
  for (var f = 0; f < Math.round(w / 90); f++) {
    var fx = r() * w, fy = base + 8 + r() * (h - base) * 0.5, col = LANTERN_COLORS[Math.floor(r() * LANTERN_COLORS.length)];
    var fg = g.createRadialGradient(fx, fy, 0.5, fx, fy, 14); fg.addColorStop(0, rgba(col, 0.75)); fg.addColorStop(1, rgba(col, 0));
    g.fillStyle = fg; g.beginPath(); g.arc(fx, fy, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff1c4'; g.fillRect(fx - 1.5, fy - 1.5, 3, 3);
  }

  var rows = h < 300 ? 2 : 3;
  for (var row = 0; row < rows; row++) {
    var y0 = h * (0.03 + row * 0.12), sag = h * (0.07 + row * 0.015), spacing = 50 + row * 12;
    var span = 380 + r() * 220, start = -r() * span;
    for (var s0 = start; s0 < w + 40; s0 += span) {
      var e0 = s0 + span, cx = (s0 + e0) / 2, cy = y0 + sag * 2;
      g.strokeStyle = 'rgba(255,220,170,0.22)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(s0, y0); g.quadraticCurveTo(cx, cy, e0, y0); g.stroke();
      var n = Math.max(3, Math.floor(span / spacing));
      for (var q = 1; q < n; q++) {
        var tq = q / n, u = 1 - tq;
        var px = u * u * s0 + 2 * u * tq * cx + tq * tq * e0, py = u * u * y0 + 2 * u * tq * cy + tq * tq * y0;
        var size = h * 0.026 * (1.25 - row * 0.22) * (0.8 + r() * 0.5);
        lantern(g, px, py + size * 1.6 + r() * 4, size, LANTERN_COLORS[Math.floor(r() * LANTERN_COLORS.length)]);
      }
    }
  }

  var vg = g.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.3, w / 2, h * 0.45, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
}
var heroRaf = 0, lastSize = '';
function drawHeroSoon() {
  cancelAnimationFrame(heroRaf);
  heroRaf = requestAnimationFrame(function () {
    var c = document.getElementById('hero-canvas'); if (!c) return;
    var key = Math.round(c.clientWidth) + 'x' + Math.round(c.clientHeight);
    if (key === lastSize) return; lastSize = key; drawHero();
  });
}

/* ================= boot ================= */
hydrate(document);
applyStatic();
renderMain();
updateSearchClear();
drawHero(); lastSize = Math.round($('#hero-canvas').clientWidth) + 'x' + Math.round($('#hero-canvas').clientHeight);
startLiveRate();
if (window.ResizeObserver) { new ResizeObserver(drawHeroSoon).observe($('#hero-canvas')); } else { window.addEventListener('resize', drawHeroSoon); }
})();
