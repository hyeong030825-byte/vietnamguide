    c_mkTitle: 'Markets: how not to get overcharged', c_mkDesc: 'Especially at markets like Hàn, Bến Thành and Đồng Xuân, at night markets and in seafood restaurants.',
    c_mk1T: 'Ask first, get it in numbers', c_mk1: 'If there is no price tag, ask before you choose, and get the unit (each, per kg, per 100 g) and the total as numbers on a calculator or paper. Bargain in dong, not dollars, and if the zeros get confusing, check the won amount in the Dong Calculator.',

    c_mk3T: 'Haggle only where there are no price tags', c_mk3: 'Haggling is normal for market souvenirs, night-market goods and street stalls, but not in fixed-price shops (Giá cố định), restaurants with menus, supermarkets or Grab. Compare two or three stalls, open a little below what you would happily pay, and once you agree a price, buy it. The first customer of the day (mở hàng) is thought to set the day’s luck, so sellers may give a good price, but haggling and then walking away is very bad form.',

  { id: 'bye', cat: 'greet', ko: ['안녕히 계세요', '잘 있어'], en: 'Goodbye', vi: ['Em chào anh ạ / Em chào chị ạ', 'Chào nhé!'], pr: ['앰 짜오 아잉 아 / 앰 짜오 찌 아', '짜오 녜!'], k: '작별 헤어질 안녕히 계세요 bye goodbye', note: { ko: '상대가 형·누나뻘이면 anh(아잉)·chị(찌)를 넣어요. 부모님뻘 이상 어른이면 chú(쭈)·cô(꼬)·bác(박)·ông(옹)·bà(바)를 넣고 나를 cháu(짜우)라고 해서 Cháu chào bác ạ(짜우 짜오 박 아)처럼 말해요. 가게를 나설 때는 Em cảm ơn, chào chị ạ(앰 깜 언, 짜오 찌 아)처럼 고맙다는 말과 함께 하면 자연스러워요. Tạm biệt(땀 비엣)은 오래 헤어질 때 쓰는 딱딱한 말이라 평소엔 잘 안 써요.', en: 'Use anh / chị for someone a bit older. For people your parents’ age or older, use chú, cô, bác, ông or bà and call yourself cháu: “Cháu chào bác ạ”. Leaving a shop, “Em cảm ơn, chào chị ạ” (thanks, bye) sounds natural. “Tạm biệt” is a stiff word for long partings and rarely used day to day.' } },
  { id: 'nicetomeet', cat: 'greet', ko: ['만나서 반가워요', '만나서 반가워'], en: 'Nice to meet you', vi: ['Rất vui được làm quen ạ', 'Rất vui được gặp bạn'], pr: ['젓 부이 드억 람 꾸앤 아', '젓 부이 드억 갑 반'], k: '반가워 처음 nice meet' },
  { id: 'dontknow', cat: 'greet', ko: ['잘 못 알아들었어요', '못 알아들었어'], en: "I don't understand", vi: ['Em không hiểu', 'Tôi không hiểu'], pr: ['앰 콩 히에우', '또이 콩 히에우'], k: '이해 모르겠 understand' },
  { id: 'again', cat: 'greet', ko: ['다시 한 번 말해 주세요', '다시 말해 줘'], en: 'Could you say that again?', vi: ['Nói lại giúp em được không?', 'Nói lại giúp tôi nhé'], pr: ['노이 라이 줍 앰 드억 콩?', '노이 라이 줍 또이 녜'], k: '다시 반복 repeat again' },
  { id: 'speakslow', cat: 'greet', ko: ['천천히 말해 주세요', '천천히 말해 줘'], en: 'Please speak slowly', vi: ['Nói chậm giúp em', 'Nói chậm thôi'], pr: ['노이 쩜 줍 앰', '노이 쩜 토이'], k: '천천히 말 slowly speak' },
  { id: 'english', cat: 'greet', ko: ['영어 할 줄 아세요?', '영어 할 줄 알아?'], en: 'Do you speak English?', vi: ['Có nói tiếng Anh được không ạ?', 'Bạn nói tiếng Anh được không?'], pr: ['꼬 노이 띠엥 아잉 드억 콩 아?', '반 노이 띠엥 아잉 드억 콩?'], k: '영어 english' },
  { id: 'wait', cat: 'greet', ko: ['잠깐만요', '잠깐만'], en: 'Just a moment', vi: ['Chờ em một chút', 'Đợi chút nhé'], pr: ['쩌 앰 못 쭛', '더이 쭛 녜'], k: '잠깐 기다려 wait moment' },
  { id: 'okay', cat: 'greet', ko: ['좋아요, 그렇게 할게요', '좋아'], en: 'Okay, sounds good', vi: ['Được ạ', 'Được rồi'], pr: ['드억 아', '드억 조이'], k: '좋아요 오케이 알겠 okay ok' },
  { id: 'callstaff', cat: 'greet', ko: ['저기요! (직원을 부를 때)', '저기요!'], en: 'Excuse me! (calling staff)', vi: ['Anh ơi! / Chị ơi!', 'Em ơi!'], pr: ['아잉 어이! / 찌 어이!', '앰 어이!'], k: '저기요 직원 부르기 여기요 call staff waiter', note: { ko: '남자 직원은 Anh ơi(아잉 어이), 여자 직원은 Chị ơi(찌 어이), 나보다 어려 보이면 Em ơi(앰 어이)라고 불러요. 부모님뻘이면 Chú ơi(쭈 어이)·Cô ơi(꼬 어이), 더 나이 드신 분은 Bác ơi(박 어이)라고 해요.', en: 'Call a man “Anh ơi”, a woman “Chị ơi”, and someone younger “Em ơi”. For someone your parents’ age, “Chú ơi” (man) or “Cô ơi” (woman); older still, “Bác ơi”.' } },
  { id: 'whatisthis', cat: 'greet', ko: ['이게 뭐예요?', '이거 뭐야?'], en: 'What is this?', vi: ['Cho em hỏi, cái này là gì?', 'Cái này là gì?'], pr: ['쪼 앰 호이, 까이 나이 라 지?', '까이 나이 라 지?'], k: '뭐예요 무엇 what' },

  { id: 'menu', cat: 'food', ko: ['메뉴판 좀 주세요', '메뉴판 좀 줘'], en: 'Menu, please', vi: ['Cho em xem thực đơn', 'Cho tôi xem thực đơn nhé'], pr: ['쪼 앰 쌤 특 던', '쪼 또이 쌤 특 던 녜'], k: '메뉴 주문 menu order' },
  { id: 'nocilantro', cat: 'food', ko: ['고수 못 먹어요, 넣지 말아 주세요', '고수 넣지 마'], en: "I can't eat cilantro, please leave it out", vi: ['Em không ăn được rau mùi, đừng cho nhé', 'Đừng cho rau mùi nhé'], pr: ['앰 콩 안 드억 자우 무이, 등 쪼 녜', '등 쪼 자우 무이 녜'], k: '고수 빼 주세요 빼줘 넣지 마 향채 허브 cilantro coriander herb rau mui ngo dung cho', note: { ko: '남부(호치민)에서는 고수를 ngò(응오)라고 하고 Đừng bỏ ngò nha(등 보 응오 냐)라고 해요. bỏ는 남부에선 "넣다"지만 북부에선 "빼다"라서, Không bỏ rau mùi는 하노이에선 "고수 빼지 마세요"로 들릴 수 있어요. cho(넣다)는 어디서나 통해요.', en: 'In the south cilantro is “ngò”: Đừng bỏ ngò nha. “Bỏ” means “put in” in the south but “take out” in the north, so “Không bỏ rau mùi” can sound like “don’t take out the cilantro” in Hanoi. “Cho” (put in) works everywhere.' } },
  { id: 'noice', cat: 'food', ko: ['얼음 빼 주세요', '얼음 빼 줘'], en: 'No ice, please', vi: ['Đừng cho đá giúp em', 'Đừng cho đá nhé'], pr: ['등 쪼 다 줍 앰', '등 쪼 다 녜'], k: '얼음 ice', note: { ko: '남부(호치민)에서는 Đừng bỏ đá nha(등 보 다 냐)라고 많이 해요. bỏ는 북부에서 "빼다"라는 뜻이라, 하노이에서는 cho(넣다)를 쓰는 게 안전해요. 음료를 시킬 때 Một cà phê sữa, không đá(얼음 없이 연유 커피 하나)처럼 뒤에 붙여도 돼요.', en: 'In the south people often say “Đừng bỏ đá nha”. In the north bỏ means “take out”, so “cho” is the safe choice in Hanoi. You can also tag it onto a drink order: “Một cà phê sữa, không đá”.' } },
  { id: 'lesssweet', cat: 'food', ko: ['덜 달게 해 주세요', '덜 달게 해 줘'], en: 'Less sugar, please', vi: ['Cho em ít đường', 'Cho tôi ít đường nhé'], pr: ['쪼 앰 잇 드엉', '쪼 또이 잇 드엉 녜'], k: '설탕 단맛 당도 sugar sweet' },

  { id: 'toilet', cat: 'food', ko: ['화장실이 어디예요?', '화장실 어디야?'], en: 'Where is the restroom?', vi: ['Cho em hỏi, nhà vệ sinh ở đâu?', 'Nhà vệ sinh ở đâu?'], pr: ['쪼 앰 호이, 냐 베 씽 어 더우?', '냐 베 씽 어 더우?'], k: '화장실 toilet restroom wc bathroom' },
  { id: 'takeaway', cat: 'food', ko: ['포장해 주세요', '포장해 줘'], en: 'To go, please', vi: ['Cho em mang về', 'Cho tôi mang về nhé'], pr: ['쪼 앰 망 베', '쪼 또이 망 베 녜'], k: '포장 테이크아웃 take away takeout' },

  { id: 'bill', cat: 'food', ko: ['계산해 주세요', '계산해 줘'], en: 'The bill, please', vi: ['Cho em tính tiền', 'Tính tiền cho tôi nhé'], pr: ['쪼 앰 띤 띠엔', '띤 띠엔 쪼 또이 녜'], k: '계산 계산서 영수증 결제 bill check pay', note: { ko: '북부에서는 Thanh toán(타잉 또안)도 많이 써요', en: 'In the north you will also hear “Thanh toán”' } },
  { id: 'table', cat: 'food', ko: ['두 명이에요', '두 명이야'], en: 'A table for two, please', vi: ['Cho em bàn hai người', 'Bàn hai người nhé'], pr: ['쪼 앰 반 하이 응으어이', '반 하이 응으어이 녜'], k: '자리 테이블 인원 몇 명 table seat' },
  { id: 'best', cat: 'food', ko: ['뭐가 제일 맛있어요?', '뭐가 제일 맛있어?'], en: "What's your best dish?", vi: ['Món nào ngon nhất ạ?', 'Món nào ngon nhất?'], pr: ['몬 나오 응온 녓 아?', '몬 나오 응온 녓?'], k: '추천 대표 메뉴 recommend best' },
  { id: 'thisdish', cat: 'food', ko: ['이거 주세요 (메뉴를 가리키며)', '이거 줘'], en: 'This one, please (pointing at the menu)', vi: ['Cho em món này', 'Cho tôi món này nhé'], pr: ['쪼 앰 몬 나이', '쪼 또이 몬 나이 녜'], k: '주문 이거 order this' },
  { id: 'onemore', cat: 'food', ko: ['하나 더 주세요', '하나 더 줘'], en: 'One more, please', vi: ['Cho em thêm một phần nữa', 'Thêm một phần nữa nhé'], pr: ['쪼 앰 템 못 펀 느어', '템 못 펀 느어 녜'], k: '추가 하나 더 more another', note: { ko: '음식은 phần(펀), 병은 chai(짜이), 캔은 lon(론), 잔은 cốc(꼭, 북부)·ly(리, 남부)로 바꿔 말해요. 예: Cho em thêm một lon nữa(맥주 한 캔 더)', en: 'Swap phần (a dish) for chai (bottle), lon (can) or cốc / ly (glass, north / south): “Cho em thêm một lon nữa” (one more can)' } },
  { id: 'nomsg', cat: 'food', ko: ['MSG 빼 주세요', 'MSG 빼 줘'], en: 'No MSG, please', vi: ['Đừng cho mì chính giúp em', 'Đừng cho mì chính nhé'], pr: ['등 쪼 미 찐 줍 앰', '등 쪼 미 찐 녜'], k: '조미료 msg 미원', note: { ko: '남부(호치민)에서는 MSG를 bột ngọt(봇 응옷)이라고 해요', en: 'In the south MSG is “bột ngọt”' } },
  { id: 'nopeanut', cat: 'food', ko: ['땅콩 빼 주세요', '땅콩 빼 줘'], en: 'No peanuts, please', vi: ['Đừng cho lạc giúp em', 'Đừng cho lạc nhé'], pr: ['등 쪼 락 줍 앰', '등 쪼 락 녜'], k: '땅콩 견과 알레르기 peanut nut', note: { ko: '남부에서는 땅콩을 đậu phộng(더우 퐁)이라고 해요', en: 'In the south peanuts are “đậu phộng”' } },
  { id: 'isspicy', cat: 'food', ko: ['이거 매워요?', '이거 매워?'], en: 'Is this spicy?', vi: ['Món này có cay không ạ?', 'Món này cay không?'], pr: ['몬 나이 꼬 까이 콩 아?', '몬 나이 까이 콩?'], k: '매워 매운 spicy' },
  { id: 'vegetarian', cat: 'food', ko: ['채식 메뉴 있어요?', '채식 메뉴 있어?'], en: 'Do you have vegetarian dishes?', vi: ['Ở đây có món chay không ạ?', 'Có món chay không?'], pr: ['어 더이 꼬 몬 짜이 콩 아?', '꼬 몬 짜이 콩?'], k: '채식 비건 고기 vegetarian vegan' },
  { id: 'forhere', cat: 'food', ko: ['먹고 갈게요', '먹고 갈게'], en: 'For here, please', vi: ['Em ăn ở đây', 'Ăn ở đây nhé'], pr: ['앰 안 어 더이', '안 어 더이 녜'], k: '매장 먹고 갈게요 for here eat in' },
  { id: 'icedcoffee', cat: 'food', ko: ['연유 아이스커피 한 잔 주세요', '연유 아이스커피 하나 줘'], en: 'An iced coffee with condensed milk, please', vi: ['Cho em một cà phê sữa đá', 'Một cà phê sữa đá nhé'], pr: ['쪼 앰 못 까 페 쓰어 다', '못 까 페 쓰어 다 녜'], k: '커피 카페 쓰어다 연유 coffee cafe', note: { ko: '블랙 아이스커피는 cà phê đen đá(까 페 댄 다), 코코넛 커피는 cà phê dừa(까 페 즈어)예요', en: 'Black iced coffee is “cà phê đen đá”; coconut coffee is “cà phê dừa”' } },
  { id: 'beer', cat: 'food', ko: ['맥주 두 병 주세요', '맥주 두 병 줘'], en: 'Two bottles of beer, please', vi: ['Cho em hai chai bia', 'Hai chai bia nhé'], pr: ['쪼 앰 하이 짜이 비어', '하이 짜이 비어 녜'], k: '맥주 술 병 잔 캔 생맥주 bia hoi beer bottle glass can', note: { ko: '병은 chai(짜이), 캔은 lon(론), 잔은 북부에서 cốc(꼭)·남부에서 ly(리)예요. 캔 두 개는 Cho em hai lon bia(쪼 앰 하이 론 비어), 잔 두 개는 Cho em hai cốc bia(쪼 앰 하이 꼭 비어)라고 해요. 하노이 길거리 생맥주 bia hơi(비어 허이)는 잔으로 시켜요.', en: 'A bottle is chai, a can is lon, and a glass is cốc in the north or ly in the south: “Cho em hai lon bia” (two cans), “Cho em hai cốc bia” (two glasses). Hanoi’s street draft beer, bia hơi, comes by the glass.' } },
  { id: 'cheers', cat: 'food', ko: ['건배!', '건배!'], en: 'Cheers!', vi: ['Một, hai, ba, dô!', 'Một, hai, ba, dô!'], pr: ['못, 하이, 바, 조!', '못, 하이, 바, 조!'], k: '건배 술자리 cheers', note: { ko: '“하나, 둘, 셋, 건배!”라는 뜻으로 다 같이 외쳐요', en: 'It means “One, two, three, cheers!” and everyone shouts it together' } },
  { id: 'spoon', cat: 'food', ko: ['숟가락 좀 주세요', '숟가락 좀 줘'], en: 'A spoon, please', vi: ['Cho em xin cái thìa', 'Cho tôi cái thìa nhé'], pr: ['쪼 앰 씬 까이 티어', '쪼 또이 까이 티어 녜'], k: '숟가락 수저 젓가락 spoon chopsticks', note: { ko: '남부에서는 숟가락을 muỗng(무옹)이라고 해요. 젓가락은 đũa(두어)예요', en: 'In the south a spoon is “muỗng”; chopsticks are “đũa”' } },
  { id: 'tissue', cat: 'food', ko: ['휴지 좀 주세요', '휴지 좀 줘'], en: 'Some napkins, please', vi: ['Cho em xin khăn giấy', 'Cho tôi khăn giấy nhé'], pr: ['쪼 앰 씬 칸 저이', '쪼 또이 칸 저이 녜'], k: '휴지 냅킨 tissue napkin' },
  { id: 'full', cat: 'food', ko: ['배불러요', '배불러'], en: "I'm full", vi: ['Em no rồi', 'No rồi'], pr: ['앰 노 조이', '노 조이'], k: '배불러 그만 full' },

  { id: 'howmuch', cat: 'shop', ko: ['이거 얼마예요?', '이거 얼마야?'], en: 'How much is this?', vi: ['Cho em hỏi, cái này bao nhiêu tiền?', 'Cái này bao nhiêu?'], pr: ['쪼 앰 호이, 까이 나이 바오 니에우 띠엔?', '까이 나이 바오 니에우?'], k: '가격 얼마 price' },
  { id: 'expensive', cat: 'shop', ko: ['너무 비싸요', '너무 비싸'], en: "It's too expensive", vi: ['Đắt quá', 'Đắt thế!'], pr: ['닷 꽈', '닷 테!'], k: '비싸 흥정 expensive', note: { ko: '남부에서는 Mắc quá(막 꽈)라고 해요', en: 'In the south: “Mắc quá”' } },

      { k: 'fly', ko: '인천에서 직항 약 5시간, 깜라인 국제공항(CXR) 도착. 부산 등 지방 공항에서도 직항이 있고, 밤늦게 도착하는 편이 많아요.', en: 'About 5 hours nonstop from Incheon to Cam Ranh International Airport (CXR). Direct flights also leave from Busan and other regional airports, and many land late at night.' },
      { k: 'airport', ko: '공항에서 시내까지 약 35km, 차로 40~50분. Grab은 약 25만~35만 동(약 {krw:250000}~{krw:350000}), 18번 공항버스는 약 6만 5천 동(약 {krw:65000})이에요.', en: 'The airport is about 35 km from downtown, 40–50 minutes by car. Grab costs about VND 250,000–350,000 ({krw:250000}–{krw:350000}); airport bus 18 is about VND 65,000 ({krw:65000}).' },
      { k: 'season', ko: '1~8월 건기가 여행하기 좋고, 특히 2~4월이 덜 더워 쾌적해요. 9~12월은 우기로 10~11월에 비가 가장 많고 태풍이나 홍수가 오기도 해요.', en: 'The dry season from January to August is best, especially the milder February–April. September–December is the rainy season, wettest in October–November, when typhoons and floods can hit.' },
      { k: 'days', ko: '보통 3박 5일이나 4박 6일로 가요. 시내 관광과 머드 온천에 하루, 섬 투어에 하루, 빈원더스나 리조트에서 쉬는 하루를 넣으면 알맞아요.', en: 'Most trips are 3 nights/5 days or 4 nights/6 days: a day for sights and a mud bath, a day of island hopping, and a day at VinWonders or your resort.' },
      { k: 'stay', ko: '처음이라면 식당·시장이 가까운 쩐푸(Trần Phú) 해변 도로 주변 시내가 편해요. 리조트에서 쉬려면 공항에서 10~20분인 깜라인 해변(Bãi Dài) 리조트 단지가 좋지만, 시내까지는 차로 약 40분 걸려요.', en: 'First-timers do well downtown along the Trần Phú beach road, close to restaurants and markets. For a resort stay, the Bãi Dài strip near Cam Ranh is 10–20 minutes from the airport but about 40 minutes from town.' },
      { k: 'move', ko: '시내에서는 Grab이나 Xanh SM(전기 택시) 앱을 쓰면 편해요. 시내 15분 거리는 약 7만 5천~10만 동(약 {krw:75000}~{krw:100000})이고, 해변 도로 주변은 걸어 다닐 만해요.', en: 'Use Grab or Xanh SM (electric taxis) in town; a 15-minute ride is about VND 75,000–100,000 ({krw:75000}–{krw:100000}). The beachfront area is easy to walk.' }
    ],
    eats: [
      { vi: 'Bún chả cá', ko: '분짜까', d: { ko: '생선 뼈로 우린 맑은 국물에 생선 어묵을 올린 쌀국수예요. 해파리를 더하기도 해요.', en: 'Rice noodles in a clear fish-bone broth topped with fish cakes, sometimes with jellyfish.' }, dish: '' },
      { vi: 'Nem nướng Ninh Hòa', ko: '넴느엉 (닌호아식)', d: { ko: '숯불에 구운 돼지고기 소시지를 라이스페이퍼에 채소와 함께 싸서 소스에 찍어 먹어요.', en: 'Charcoal-grilled pork sausage wrapped in rice paper with fresh greens and dipped in sauce.' }, dish: '' },
      { vi: 'Bánh căn', ko: '반깐', d: { ko: '작은 토기 틀에 구운 한입 크기 쌀 팬케이크로, 메추리알·새우·오징어를 얹어 먹어요.', en: 'Bite-size rice-flour pancakes cooked in clay molds, topped with quail egg, shrimp or squid.' }, dish: '' },
      { vi: 'Hải sản', ko: '하이산 (해산물)', d: { ko: '바닷가 도시답게 새우·오징어·조개 같은 해산물을 굽거나 쪄서 푸짐하게 먹어요.', en: 'As a seaside city, Nha Trang serves plenty of prawns, squid and shellfish, grilled or steamed.' }, dish: '' } ],
    tips: [
      { ko: '밤늦게 도착하는 항공편이 많아요. 첫날은 공항 픽업을 미리 예약하거나 공항 가까운 리조트에 묵으면 편해요.', en: 'Many flights land late at night, so pre-book an airport pickup or spend the first night at a resort near the airport.' },
      { ko: '우기(10~11월)에는 파도가 높아 섬 투어가 취소되기도 해요. 날씨 영향이 적은 머드 온천이나 포나가르 사원 일정을 함께 넣어 두세요.', en: 'In the rainy months (October–November) rough seas can cancel island trips, so keep weather-proof plans like a mud bath or Po Nagar in reserve.' } ] },
  { id: 'phuquoc', emoji: '🌅', aka: '푸꾸옥 푸국 phu quoc phuquoc', k: '푸꾸옥 푸국 즈엉동 선셋타운 phu quoc phuquoc',
    name: { ko: '푸꾸옥', en: 'Phú Quốc' }, vi: 'Phú Quốc',
    tagline: { ko: '베트남에서 가장 큰 섬, 노을 지는 바다와 리조트·테마파크를 함께 즐기는 휴양지', en: "Vietnam's largest island, a resort getaway of sunset beaches and theme parks" },
    info: [
      { k: 'fly', ko: '인천에서 직항으로 약 6시간, 푸꾸옥 국제공항(PQC)에 도착해요. 부산(김해) 출발 직항도 있어요(약 5시간 30분).', en: 'About 6 hours nonstop from Incheon to Phú Quốc International Airport (PQC). There are also nonstop flights from Busan (about 5.5 hours).' },
      { k: 'airport', ko: '즈엉동 시내·롱비치까지 약 10km 안팎(차로 15~25분), Grab 약 10만~20만 동(약 {krw:100000}~{krw:200000})이에요. 남부 선셋타운까지는 약 20km(25~30분)로 Grab 약 25만 동(약 {krw:250000}) 정도예요.', en: 'Dương Đông town and Long Beach are roughly 10 km away (15–25 minutes by car); Grab costs about VND 100,000–200,000 ({krw:100000}–{krw:200000}). Sunset Town in the south is about 20 km (25–30 minutes), roughly VND 250,000 ({krw:250000}) by Grab.' },
      { k: 'season', ko: '11월~4월 건기가 가장 좋아요. 5월~10월 우기에는 서쪽 해안(롱비치·선셋타운)의 파도가 높아지고, 동쪽 사오비치·켐비치가 비교적 잔잔해요.', en: 'The November–April dry season is best. In the May–October rainy season the west coast (Long Beach, Sunset Town) gets rough seas, while Sao and Khem beaches on the east side stay calmer.' },
      { k: 'days', ko: '보통 3박 5일이나 4박 6일로 가요. 남부(케이블카·선셋타운), 북부(빈원더스·사파리·그랜드월드), 리조트 휴식에 하루씩 쓰면 알맞아요.', en: 'Most trips are 3–4 nights. Give a day each to the south (cable car, Sunset Town), the north (VinWonders, Safari, Grand World) and resort time.' },
      { k: 'stay', ko: '즈엉동·롱비치(바이쯔엉)는 공항·야시장과 가깝고 숙소 선택지가 많아요. 북부 바이다이는 빈원더스·그랜드월드 옆 리조트 단지, 남부 안터이는 선셋타운·케이블카와 가까워요.', en: 'Dương Đông and Long Beach (Bãi Trường) are close to the airport and night market, with plenty of places to stay. Bãi Dài in the north has big resorts next to VinWonders and Grand World; An Thới in the south is close to Sunset Town and the cable car.' },
      { k: 'move', ko: '섬이 남북으로 약 50km라 Grab·Xanh SM 전기 택시나 리조트 셔틀로 다니는 게 편해요. 공항·즈엉동·그랜드월드를 잇는 빈버스 17번은 2026년부터 유료예요(2만~5만 동).', en: 'The island is about 50 km from north to south, so Grab, Xanh SM electric taxis or resort shuttles are easiest. VinBus route 17 (airport, Dương Đông, Grand World) has charged fares since 2026 (VND 20,000–50,000).' }
    ],
    eats: [
      { vi: 'Gỏi cá trích', ko: '고이까찍', d: { ko: '생 청어를 코코넛 채·양파·허브와 버무려 라이스페이퍼에 싸서 느억맘에 찍어 먹는 푸꾸옥 대표 요리', en: 'Raw herring tossed with grated coconut, onion and herbs, wrapped in rice paper and dipped in fish sauce' }, dish: '' },
      { vi: 'Bún quậy', ko: '분꾸어이', d: { ko: '다진 새우·생선살 완자를 넣은 국수. 양념장을 직접 저어 만들어 곁들여요', en: 'Rice noodles with shrimp and fish paste; you stir up your own dipping sauce' }, dish: '' },
      { vi: 'Ghẹ Hàm Ninh', ko: '함닌 꽃게', d: { ko: '동쪽 어촌 함닌의 살이 단 꽃게. 주로 쪄서 먹어요', en: 'Sweet crab from Hàm Ninh fishing village on the east coast, usually steamed' }, dish: '' },
      { vi: 'Rượu sim', ko: '즈어우 씸', d: { ko: '로즈머틀(씸) 열매로 담근 달콤새콤한 과실주', en: 'Sweet, slightly tart wine made from rose myrtle berries' }, dish: '' } ],
    tips: [
      { ko: '명소가 북부(빈원더스·그랜드월드)와 남부(케이블카·선셋타운)에 나뉘어 있어요. 하루에 한 지역씩 묶어 다니면 이동 시간이 줄어요.', en: 'Sights are split between the north (VinWonders, Grand World) and the south (cable car, Sunset Town). Group each day by area to save travel time.' },
      { ko: '섬 북쪽 끝이나 남부처럼 시내에서 먼 곳에서는 Grab이 잘 안 잡힐 때가 있어요. 돌아올 차편을 미리 정해 두거나 기사 딸린 차를 빌리세요.', en: 'Grab can be patchy far from town, in the far north and the south. Arrange your ride back in advance or hire a car with a driver.' } ] },
  { id: 'hanoi', emoji: '🍜', aka: '하노이 hanoi ha noi', k: '하노이 하롱베이 하롱 구시가지 hanoi ha noi ha long halong',
    name: { ko: '하노이 · 하롱베이', en: 'Hanoi · Ha Long Bay' }, vi: 'Hà Nội · Vịnh Hạ Long',
    tagline: { ko: '천 년 고도의 골목과 바다 위 석회암 섬들을 함께 만나는 베트남 북부 여행', en: 'Old lanes of a thousand-year-old capital, paired with limestone islands rising from the sea' },
    info: [
      { k: 'fly', ko: '인천에서 직항 약 5시간, 노이바이 국제공항(HAN) 도착. 부산(김해) 출발 직항도 매일 있어요.', en: 'About 5 hours nonstop from Incheon to Nội Bài International Airport (HAN). There are daily nonstop flights from Busan (Gimhae) too.' },
      { k: 'airport', ko: '공항에서 구시가지(호안끼엠)까지 약 30km, 차로 40분~1시간. Grab·Xanh SM은 약 30만~40만 동(약 {krw:300000}~{krw:400000}), 86번 공항버스는 4만 5천 동(약 {krw:45000})이에요.', en: 'The Old Quarter (Hoàn Kiếm) is about 30 km away, 40 minutes to an hour by car. Grab or Xanh SM costs about VND 300,000–400,000 ({krw:300000}–{krw:400000}); airport bus 86 is VND 45,000 ({krw:45000}).' },
      { k: 'season', ko: '10~11월과 3~4월이 선선해서 가장 좋아요. 5~9월은 덥고 비가 잦으며 7~9월엔 태풍으로 하롱베이 크루즈가 멈추기도 하고, 12~2월은 쌀쌀해 겉옷이 필요해요.', en: 'October–November and March–April are the most pleasant. May–September is hot and rainy, and typhoons can halt Hạ Long Bay cruises in July–September; December–February is chilly, so bring a jacket.' },
      { k: 'days', ko: '보통 3박 4일~3박 5일이에요. 하노이 시내 1~2일에 하롱베이 당일 투어(고속도로로 편도 2시간 30분~3시간)나 1박 크루즈를 더해요.', en: 'Usually 3–4 nights: 1–2 days in Hanoi plus a Hạ Long Bay day trip (2.5–3 hours each way on the expressway) or an overnight cruise.' },
      { k: 'stay', ko: '구시가지(호안끼엠)는 걸어 다니기 좋지만 밤늦게까지 시끄러운 편이에요. 호수 남동쪽 프렌치 쿼터는 조용한 고급 호텔가, 서호(떠이호)는 호숫가 카페가 많은 한적한 동네예요(구시가지까지 차로 15~25분).', en: 'The walkable Old Quarter (Hoàn Kiếm) can be noisy late at night. The French Quarter southeast of the lake is quieter with upscale hotels, and West Lake (Tây Hồ) is a relaxed lakeside area full of cafés, 15–25 minutes from the Old Quarter by car.' },
      { k: 'move', ko: '구시가지는 걸어서, 먼 곳은 Grab이나 전기 택시 Xanh SM 앱으로 다녀요. 길을 건널 땐 뛰거나 멈추지 말고 같은 속도로 천천히 걸으면 오토바이가 피해 가요.', en: 'Walk around the Old Quarter and use Grab or the Xanh SM electric-taxi app for longer trips. To cross a street, walk slowly at a steady pace without running or stopping, and motorbikes will flow around you.' }
    ],
    eats: [
      { vi: 'Phở bò', ko: '퍼보', d: { ko: '맑은 소고기 육수에 말아 낸 하노이식 쌀국수', en: 'Hanoi-style beef noodle soup in a clear broth' }, dish: 'phobo' },
      { vi: 'Bún chả', ko: '분짜', d: { ko: '숯불 돼지고기와 쌀국수를 새콤달콤한 국물에 찍어 먹는 하노이 명물', en: 'Charcoal-grilled pork and rice noodles dipped in a sweet-sour broth' }, dish: 'buncha' },
      { vi: 'Chả cá Lã Vọng', ko: '짜까 라봉', d: { ko: '강황에 재운 생선을 딜과 함께 구워 쌀국수와 먹는 요리', en: 'Turmeric-marinated fish sizzled with dill, eaten with rice noodles' }, dish: '' },
      { vi: 'Cà phê trứng', ko: '에그 커피', d: { ko: '달걀노른자 크림을 듬뿍 얹은 하노이식 커피', en: 'Coffee topped with whipped egg-yolk cream' }, dish: 'caphetrung' }
    ],
    tips: [
      { ko: '기찻길 카페 거리(Train Street)는 공식적으로 출입 금지라 입구를 막아 두기도 해요. 그래도 들어간다면 선로에 바짝 붙어 앉거나 서지 마세요.', en: 'Train Street is officially off-limits and the entrances are sometimes blocked. If you do go in, never sit or stand right next to the tracks.' },
      { ko: '공항 도착 홀에서 "Grab?" 하며 다가오는 사람은 따라가지 마세요. 앱으로 부른 차의 번호판을 확인하고 타요.', en: 'Ignore people offering "Grab?" in the arrivals hall. Book in the app and check the license plate before you get in.' }
    ] },
  { id: 'hcmc', emoji: '🛵', aka: '호치민 호찌민 사이공 hcmc ho chi minh saigon sai gon', k: '호치민 호찌민 사이공 hcmc ho chi minh saigon',
    name: { ko: '호치민', en: 'Ho Chi Minh City' }, vi: 'TP. Hồ Chí Minh (Sài Gòn)',
    tagline: { ko: '오토바이 물결 속에 프랑스풍 건물과 고층 빌딩이 어우러진 베트남 최대 도시', en: "Vietnam's largest city, where French colonial buildings and skyscrapers rise above a sea of motorbikes" },
    info: [
      { k: 'fly', ko: '인천에서 직항 약 5시간 30분, 떤선녓 국제공항(SGN)에 도착해요. 부산 출발 직항도 있고, 2026년 12월 개항 예정인 롱탄 신공항으로 국제선이 차례로 옮겨 갈 예정이라 항공권의 도착 공항을 꼭 확인하세요.', en: 'About 5.5 hours nonstop from Incheon to Tân Sơn Nhất International Airport (SGN), with direct flights from Busan too. The new Long Thành airport is due to open in December 2026 and international flights will move there in phases, so check which airport your ticket uses.' },
      { k: 'airport', ko: '공항에서 1군 벤탄 시장까지 약 7~8km, 차로 25~45분이에요(출퇴근 시간엔 더 걸려요). Grab은 약 12만~25만 동(약 {krw:120000}~{krw:250000})으로 시간대에 따라 달라지고, 109번 버스(1만 5천~2만 동)는 2025년부터 국제선 T2가 아닌 국내선 T3 쪽에서 타요.', en: 'Bến Thành Market in District 1 is about 7–8 km away, 25–45 minutes by car (longer at rush hour). Grab costs about VND 120,000–250,000 ({krw:120000}–{krw:250000}) depending on the time; bus 109 (VND 15,000–20,000) now leaves from the domestic Terminal 3 side, not the international terminal (T2).' },
      { k: 'season', ko: '건기인 12~4월이 여행하기 좋고, 그중 12~2월이 덜 더워요. 5~11월 우기에는 오후에 짧고 굵은 스콜이 자주 오고, 4월은 한낮 34도를 넘을 만큼 더워요.', en: 'The dry season, December to April, is the best time to go, and December to February is the least hot. May to November is the rainy season, with short, heavy afternoon downpours; April is the hottest month, often above 34°C at midday.' },
      { k: 'days', ko: '시내만 보면 2~3일이면 충분해요. 구찌 터널·메콩강 같은 근교 투어까지 하려면 4박 5일 정도가 좋아요.', en: 'Two or three days cover the city. Allow about 4 nights and 5 days if you add day trips such as the Củ Chi Tunnels and the Mekong Delta.' },
      { k: 'stay', ko: '처음이면 벤탄 시장·응우옌후에 거리 주변의 1군이 걸어 다니기 좋아요. 부이비엔 거리 근처는 밤늦게까지 시끄럽고, 조용한 곳을 원하면 카페가 많은 3군이나 강 건너 타오디엔(옛 2군)이 좋아요.', en: 'First-timers do best in District 1 around Bến Thành Market and Nguyễn Huệ Street, where the sights are walkable. Streets near Bùi Viện are loud late into the night; for somewhere calmer, try café-filled District 3 or Thảo Điền across the river (former District 2).' },
      { k: 'move', ko: 'Grab이나 전기 택시 앱 Xanh SM으로 부르면 편하고, 1군 중심가는 걸어서 다닐 만해요. 2024년 12월 개통한 메트로 1호선(벤탄~수오이띠엔)은 1회 7천~2만 동(약 {krw:7000}~{krw:20000})이고 타오디엔에 갈 때 편해요.', en: 'Grab or the Xanh SM electric-taxi app is easiest, and central District 1 is walkable. Metro Line 1 (Bến Thành–Suối Tiên), opened in December 2024, costs VND 7,000–20,000 a ride ({krw:7000}–{krw:20000}) and is handy for Thảo Điền.' }
    ],
    eats: [

  { id: 'nt_mudbath', city: 'nhatrang', time: 'day', emoji: '♨️', area: { ko: '시내 외곽', en: 'Edge of town' },

  { id: 'pq_kissshow', city: 'phuquoc', time: 'night', emoji: '🎆', area: { ko: '남부 선셋타운', en: 'Sunset Town (south)' },

  { id: 'hn_walkingstreet', city: 'hanoi', time: 'night', emoji: '🌃', area: { ko: '호안끼엠 · 구시가지', en: 'Hoàn Kiếm · Old Quarter' },

  { id: 'sg_cuchi', city: 'hcmc', time: 'day', emoji: '🕳️', area: { ko: '근교 (구찌)', en: 'Day trip (Củ Chi)' },
    name: { ko: '구찌 터널 반나절 투어', en: 'Củ Chi Tunnels half-day tour' },

    dur: { ko: '반나절 투어 6~8시간 (왕복 이동 포함)', en: 'Half-day tour, 6–8 hours including the drive' },
    desc: { ko: '베트남 전쟁 때 게릴라들이 판, 총길이 200km가 넘는 지하 땅굴이에요. 좁은 굴을 직접 기어 보고 함정과 생활 흔적을 둘러본 뒤, 게릴라들이 먹던 삶은 카사바를 맛보는 투어가 많아요.', en: 'A network of more than 200 km of tunnels dug by guerrillas during the Vietnam War. Crawl through a narrow stretch, see traps and traces of underground life, and on most tours taste the boiled cassava the fighters lived on.' },
    where: { ko: '호치민 시내에서 북서쪽으로 60~70km. 벤딘(Bến Đình)이 더 가깝고, 벤즈억(Bến Dược)은 더 넓고 한적해요', en: '60–70 km northwest of the city. Bến Đình is closer; Bến Dược is larger and quieter' },
    when: { ko: '매일 오전 7시~오후 5시 (입장은 오후 4시까지), 덜 더운 오전이 좋아요', en: 'Daily 7 AM–5 PM (last entry 4 PM); mornings are cooler' },
    price: { ko: '외국인 입장료 13만 5천 동(약 {krw:135000}) · 반나절 단체 투어 약 1만 9천 원부터(온라인 예약가) · 스피드보트 투어 1인 약 $85~120 · 사격은 별도 요금', en: 'Foreign visitors VND 135,000 (about {krw:135000}); half-day group tours from about ₩19,000 online; speedboat tours about $85–120 per person; shooting costs extra' },
    how: { ko: '호텔 픽업이 포함된 반나절 단체 투어로 가는 게 가장 편해요. 사이공강을 따라 가는 스피드보트 투어도 있어요.', en: 'A half-day group tour with hotel pickup is easiest. Speedboat tours along the Saigon River also run.' },
    tips: [
      { ko: '굴 안은 좁고 덥고 흙이 묻어요. 더러워져도 되는 가벼운 옷과 운동화를 신고, 모기 기피제를 챙기세요.', en: 'The tunnels are tight, hot and dusty. Wear light clothes you do not mind getting dirty and closed shoes, and bring insect repellent.' },

  { id: 'sg_mekong', city: 'hcmc', time: 'day', emoji: '🥥', area: { ko: '근교 (메콩 델타)', en: 'Day trip (Mekong Delta)' },

      if (modal.data.armed !== v) { modal.data.armed = v; renderModal(); return true; }
      api('DELETE', 'reviews?id=' + encodeURIComponent(v)).then(function () {
        var d2 = modal.data; d2.armed = ''; if (d2.mineId === v) { d2.mineId = null; d2.body = ''; d2.rating = 5; d2.photos = []; } toast(t('rv_deleted'), 'ri-delete-bin-line'); loadReviews();
        if (state.tab === 'reviews' && rv.view === 'places') { rvReset(); rvEnsure(); }
      }).catch(function () { toast(t('rv_err'), 'ri-error-warning-line'); });
      return true;
    case 'review-report':
      api('POST', 'report', { id: v }).then(function () { toast(t('rv_reported'), 'ri-flag-line'); loadReviews(); })
        .catch(function () { toast(t('rv_err'), 'ri-error-warning-line'); });
      return true;
  }
  return false;
}

/* ================= boot ================= */
hydrate(document);
applyStatic();
renderMain();
updateSearchClear();
drawHero(); lastSize = Math.round($('#hero-canvas').clientWidth) + 'x' + Math.round($('#hero-canvas').clientHeight);
startLiveRate();
authInit();
if (window.ResizeObserver) { new ResizeObserver(drawHeroSoon).observe($('#hero-canvas')); } else { window.addEventListener('resize', drawHeroSoon); }
})();
</script>
