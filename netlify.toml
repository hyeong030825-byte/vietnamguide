# Netlify 설정 (예전 호스팅): 빌드 없이 site 폴더를 그대로 공개합니다.
# 보안 헤더는 site/_headers 에 있습니다 (Cloudflare Pages와 Netlify 모두 읽어요).
[build]
  publish = "site"

# 사이트를 Cloudflare Pages로 옮겼습니다. 옛 Netlify 주소로 들어오면 새 주소로 보냅니다.
[[redirects]]
  from = "/*"
  to = "https://vietnamguide.pages.dev/:splat"
  status = 301
  force = true
